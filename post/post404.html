<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>404 — Bài đăng không tồn tại</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ffffff;
      color: #1a1a1a;
      font-family: "Baloo 2", "Comic Sans MS", "Segoe UI", sans-serif;
      text-align: center;
      padding: 24px;
    }
    .card { max-width: 420px; }
    .code {
      font-size: 72px;
      font-weight: 800;
      margin: 0 0 8px;
      color: #d33333;
    }
    .msg {
      font-size: 18px;
      margin: 0 0 30px;
      line-height: 1.6;
      color: #333333;
    }
    .home-btn {
      display: inline-block;
      padding: 12px 28px;
      border-radius: 999px;
      background: #3fce3f;
      color: #ffffff;
      font-weight: 700;
      font-size: 16px;
      text-decoration: none;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.18);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .home-btn:hover,
    .home-btn:focus-visible {
      transform: translateY(-2px);
      box-shadow: 0 10px 22px rgba(0, 0, 0, 0.22);
    }
  </style>
</head>
<body>
  <div class="card">
    <p class="code">404</p>
    <p class="msg">Bài đăng này đã bị gỡ bỏ hoặc không tồn tại.</p>
    <a class="home-btn" href="index.html">Quay về trang chủ</a>
  </div>
  <script src="/js/pwa.js" defer></script>
</body>
</html>
