<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>404 — Không tìm thấy trang</title>
  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #050608;
      color: #f4ecd8;
      font-family: "Baloo 2", "Comic Sans MS", "Segoe UI", sans-serif;
      text-align: center;
      padding: 24px;
    }

    .error-card {
      max-width: 420px;
    }

    .error-code {
      font-size: 96px;
      font-weight: 800;
      line-height: 1;
      margin: 0 0 8px;
      color: #f4ecd8;
      text-shadow: 0 2px 10px rgba(0,0,0,0.6);
    }

    .error-title {
      font-size: 22px;
      font-weight: 700;
      margin: 0 0 12px;
    }

    .error-desc {
      font-size: 15px;
      line-height: 1.6;
      color: rgba(244, 236, 216, 0.75);
      margin: 0 0 32px;
    }

    .home-btn {
      display: inline-block;
      padding: 13px 28px;
      border-radius: 999px;
      background: linear-gradient(180deg, #3fce3f, #1f9a2f);
      color: #f4fff0;
      font-weight: 700;
      font-size: 16px;
      text-decoration: none;
      border: 2px solid rgba(255,255,255,0.25);
      box-shadow: 0 6px 16px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.25);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .home-btn:hover,
    .home-btn:focus-visible {
      transform: translateY(-2px);
      box-shadow: 0 10px 22px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.3);
    }

    .home-btn:active {
      transform: translateY(0);
    }
  </style>
</head>
<body>
  <div class="error-card">
    <p class="error-code">404</p>
    <h1 class="error-title">Trang không tồn tại</h1>
    <p class="error-desc">Đường dẫn bạn vừa mở không có trên trang web này. Có thể liên kết đã bị sai hoặc trang đã được gỡ bỏ.</p>
    <a class="home-btn" href="/index.html">Về trang chủ</a>
  </div>
  <script src="/js/pwa.js" defer></script>
</body>
</html>
