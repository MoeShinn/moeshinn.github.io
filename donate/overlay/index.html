<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>Donate overlay</title>
<style>html,body{margin:0;height:100%;background:transparent!important;overflow:hidden;font-family:"Baloo 2","Segoe UI",sans-serif;color:#fff}
#stage{position:fixed;inset:0;display:flex;padding:24px;box-sizing:border-box}
.alert{display:flex;align-items:center;text-align:center;animation:in .4s ease-out}.alert.v{flex-direction:column}.alert.h{flex-direction:row;text-align:left}
.alert img{object-fit:contain;flex:none}.alert .t{display:flex;flex-direction:column;gap:6px;min-width:0}.alert.h .t{flex:1}
@keyframes in{from{opacity:0;transform:translateY(-16px)}to{opacity:1;transform:none}}.alert.out{opacity:0;transition:opacity .5s}</style>
<style id="usercss"></style></head><body><div id="stage"></div>
<script src="/donate/js/tts.js"></script>
<script>
(() => {
  const Q = new URLSearchParams(location.search), TOKEN = Q.get("t") || "", PREVIEW = Q.has("preview"), $ = (s) => document.querySelector(s);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const COL = { 0: "#000", 1: "#00a", 2: "#0a0", 3: "#0aa", 4: "#a00", 5: "#a0a", 6: "#fa0", 7: "#aaa", 8: "#555", 9: "#55f", a: "#5f5", b: "#5ff", c: "#f55", d: "#f5f", e: "#ff5", f: "#fff" };
  // Mã § kiểu Minecraft: 0-f màu, l đậm, o nghiêng, n gạch chân, m gạch ngang, r reset. Giá trị người donate bị thay SAU khi tách mã nên không thể chèn §.
  function mc(tpl, vars) {
    const parts = String(tpl || "").split(/§([0-9a-fk-or])/i); let st = {}, h = "";
    for (let i = 0; i < parts.length; i++) {
      if (i % 2) { const c = parts[i].toLowerCase(); if (COL[c]) st = { ...st, c: COL[c] }; else if (c === "r") st = {}; else if ("lonm".includes(c)) st = { ...st, [c]: 1 }; continue; }
      const t = esc(parts[i]).replace(/\{(DISPLAY NAME|AMOUNT|MESSENGER)\}/g, (_, k) => esc(vars[k])); if (!t) continue;
      const css = (st.c ? `color:${st.c};` : "") + (st.l ? "font-weight:700;" : "") + (st.o ? "font-style:italic;" : "") + ((st.n || st.m) ? `text-decoration:${[st.n && "underline", st.m && "line-through"].filter(Boolean).join(" ")};` : "");
      h += css ? `<span style="${css}">${t}</span>` : t;
    }
    return h.replace(/\n/g, "<br>");
  }
  let cfg, queue = [], busy = false;
  const apply = (c) => { cfg = c; $("#usercss").textContent = c.alert.css || ""; const s = $("#stage").style, a = c.alert;
    s.justifyContent = { left: "flex-start", center: "center", right: "flex-end" }[a.posX]; s.alignItems = { top: "flex-start", middle: "center", bottom: "flex-end" }[a.posY]; };
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  async function show(al) {
    const a = cfg.alert, t = cfg.tts, vars = { "DISPLAY NAME": al.name, AMOUNT: Number(al.amount).toLocaleString("vi-VN"), MESSENGER: al.msg || "" };
    const el = document.createElement("div"); el.className = "alert " + (a.layout === "h" ? "h" : "v");
    const img = a.image ? `<img src="${esc(a.image)}" style="width:${+a.imgW || 200}px;${a.layout === "h" ? "" : `height:${+a.imgH || 200}px`}" alt="">` : "";
    el.innerHTML = img + `<div class="t"><div class="h1">${mc(a.h1, vars)}</div>${al.msg ? `<div class="mes">${mc(a.mes, vars)}</div>` : ""}</div>`;
    if (a.layout === "h") { const i = el.querySelector("img"); if (i) i.style.alignSelf = "stretch"; }
    $("#stage").replaceChildren(el);
    const t0 = Date.now(), max = (+a.duration || 15) * 1000; let end = (+a.minShow || 6) * 1000;
    if (a.sound) { const s = new Audio(a.sound); s.volume = Math.min(1, (+a.volume || 80) / 100); s.play().catch(() => {}); }
    const T = window.ShinjuTTS, tc = T.cfg(t);
    // Giọng đọc: Google TTS → tự chuyển speechSynthesis nếu Google lỗi/bị chặn. al.audio === "mute" = alert thử không đọc.
    if (tc.on && al.audio !== "mute" && Number(al.amount) >= (+tc.min || 0)) {
      await sleep((+tc.delay || 0) * 1000);
      const left = max - (Date.now() - t0);
      if (left > 500) {
        const spoken = T.build(tc, al);
        await Promise.race([T.speak(spoken, tc), sleep(left)]); T.cancel(); // quá thời gian tối đa thì cắt
        end = Math.max(end, Date.now() - t0 + 1000);
      }
    }
    await sleep(Math.max(0, Math.min(max, end) - (Date.now() - t0)));
    el.classList.add("out"); await sleep(500); el.remove();
  }
  async function pump() { if (busy) return; busy = true; while (queue.length) { try { await show(queue.shift()); } catch {} } busy = false; }
  window.addEventListener("message", (e) => { if (!PREVIEW || !e.data) return; if (e.data.cfg) apply(e.data.cfg); if (e.data.alert) { queue.push(e.data.alert); pump(); } });
  async function main() {
    cfg0 = await (await fetch("/donate/data.json", { cache: "no-cache" })).json(); apply(cfg0);
    if (PREVIEW) return parent.postMessage({ ready: 1 }, "*");
    const API = cfg0.api; const always = Q.has("always"); let cursor = null, tt = 0, timer = 0, streaming = !window.obsstudio || always, visible = true; const t0 = Date.now(), inObs = !!window.obsstudio;
    const active = () => visible && (inObs || (document.visibilityState === "visible" && Date.now() - t0 < 6 * 3600e3)); // trong OBS luôn quét; chưa stream thì chỉ phát alert test
    // Chỉ cho MỘT lượt quét chạy tại một thời điểm. Trước đây tick() đặt timer=0 rồi mới await fetch, nên trong OBS
    // (getStatus + kick cuối main gọi kick() gần như cùng lúc) sinh ra 2 vòng quét song song dùng chung cursor → cùng nhận 1 alert → phát đúp.
    // seen = lớp chống trùng thứ hai theo id alert (id test dạng T<ms><rand>, id thật là số tăng dần, không bao giờ trùng).
    const seen = new Set(); let running = false;
    async function tick() {
      if (running) return; running = true; clearTimeout(timer); timer = 0;
      try {
        if (!active()) return;
        const r = await (await fetch(`${API}/api/alerts?t=${encodeURIComponent(TOKEN)}&after=${cursor ?? "latest"}&tt=${tt}`)).json();
        if (r.items) {
          cursor = r.last; tt = r.tt || tt;
          queue.push(...r.items.filter((x) => (streaming || x.test) && !seen.has(x.id) && seen.add(x.id)));
          if (seen.size > 500) seen.delete(seen.values().next().value);
          pump();
        }
      } catch {} finally { running = false; }
      if (active()) timer = setTimeout(tick, 5000);
    }
    const kick = () => { if (!timer && active()) tick(); };
    if (inObs) {
      obsstudio.getStatus && obsstudio.getStatus((s) => { streaming = !!s.streaming || always; kick(); }); // có ?always thì luôn phát, không để trạng thái stream ghi đè
      addEventListener("obsStreamingStarted", () => { streaming = true; kick(); });
      addEventListener("obsStreamingStopped", () => { streaming = always; });
      addEventListener("obsSourceVisibleChanged", (e) => { visible = e.detail.visible; kick(); });
    }
    document.addEventListener("visibilitychange", () => { kick(); });
    kick();
  }
  let cfg0; main();
})();
</script></body></html>
