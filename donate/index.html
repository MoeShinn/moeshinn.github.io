  <script src="/js/loading.js"></script>

  <header class="site-header">
    <a href="/" class="site-header-logo" data-nav-home aria-label="Về trang chủ">

  <script src="/js/site-chrome.js"></script>

  <main class="page">
    <h1 class="page-title" data-title>Ủng Hộ Shinju Ch.</h1>
    <p class="dn-intro" data-intro></p>
    <section class="dn-card" data-form-card>
      <label>Tên hiển thị<input data-name maxlength="24" placeholder="Tên của bạn" autocomplete="nickname"></label>
      <label>Số tiền (đ)<input data-amount inputmode="numeric" placeholder="20000"></label>
      <div class="dn-presets" data-presets></div>
      <label>Lời nhắn <small data-count></small><textarea data-msg rows="3" placeholder="Lời nhắn hiện trên stream (không bắt buộc)"></textarea></label>
      <p class="dn-err" data-err hidden></p>
      <button type="button" class="dn-go" data-go>Tạo mã QR donate</button>
    </section>
    <section class="dn-card" data-qr-card hidden>
      <img data-qr alt="Mã QR chuyển khoản donate" width="260" height="260">
      <dl class="dn-info" data-info></dl>
      <p class="dn-note" data-hidden-note hidden>Tin nhắn chưa kiểm duyệt được nên sẽ không hiện trên stream, tiền vẫn được ghi nhận.</p>
      <p class="dn-note">Nhớ giữ nguyên nội dung chuyển khoản để alert hiện đúng tên bạn nhé.</p>
      <button type="button" class="dn-back" data-back>Quay lại</button>
    </section>
    <section class="dn-card" data-stats hidden>
      <h2>Lịch sử donate</h2><p class="dn-sum" data-sum></p><ul class="dn-list" data-list></ul>
    </section>

    <footer class="site-footer" data-global-footer>© 2026 Shinju Ch. (@ShinjuVNer). All rights reserved.</footer>
  </main>

  <script src="/donate/js/main.js"></script>
