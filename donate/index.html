  <link rel="icon" type="image/png" sizes="192x192" href="/assets/favicon/favicon-192.png?v=mvdx4gck" />

<script src="/js/theme.js" defer></script>
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#050b16" />
  <script src="/js/pwa.js" defer></script>

<body>

  <script src="/js/loading.js"></script>

  <header class="site-header">
    <a href="/" class="site-header-logo" data-nav-home aria-label="Về trang chủ">
      <img src="/assets/avatar/avatar-336.webp" alt="Shinju Ch." width="36" height="36" srcset="/assets/avatar/avatar-168.webp 1x, /assets/avatar/avatar-336.webp 2x" data-nav-logo />
    </a>
    <div class="site-header-menu-wrap">
      <button type="button" class="site-header-menu-btn" data-nav-menu-toggle aria-haspopup="true" aria-expanded="false" aria-label="Menu">☰</button>
      <nav class="site-header-menu" data-nav-menu role="menu"><!--pre:nav--><a href="/" role="menuitem">Trang chủ</a><a href="/channel/" role="menuitem">Kênh</a><a href="/donate/" role="menuitem">Donate</a><a href="/post/" role="menuitem">Bài Đăng</a><!--/pre:nav--></nav>
    </div>
  </header>
  <script src="/js/site-chrome.js"></script>

  <main class="page">
    <h1 class="page-title" data-title>Ủng Hộ Shinju Ch.</h1>

    <div class="method-list" data-method-list><!--pre:methods--><div class="method"><div class="method-label">Donate qua</div><div class="donate-btn-row"><a class="donate-btn" href="https://zypage.com/shinjuch" target="_blank" rel="noopener noreferrer">ZYPAGE</a><a class="donate-btn" href="https://ganknow.com/shinjuch" target="_blank" rel="noopener noreferrer">GANK</a></div></div><!--/pre:methods--></div>

    <footer class="site-footer" data-global-footer>© 2026 Shinju Ch. (@ShinjuVNer). All rights reserved.</footer>
  </main>

  <!-- Overlay shown for both QR and Link donate methods -->
  <div class="overlay" data-overlay hidden>
    <div class="overlay-card" data-overlay-card role="dialog" aria-modal="true">
      <h2 class="overlay-label" data-overlay-label></h2>

      <!-- QR variant -->
      <div class="overlay-qr" data-overlay-qr hidden>
        <img data-overlay-qr-img src="" alt="Mã QR donate" />
        <div class="overlay-actions">
          <a class="overlay-btn primary" data-overlay-save download>Lưu</a>
          <button type="button" class="overlay-btn" data-overlay-back>Quay lại</button>
        </div>
      </div>

      <!-- Link variant -->
      <div class="overlay-link" data-overlay-link hidden>
        <a class="overlay-link-box" data-overlay-link-href></a>
        <div class="overlay-actions">
          <button type="button" class="overlay-btn primary" data-overlay-open>Mở</button>
          <button type="button" class="overlay-btn" data-overlay-back-link>Quay lại</button>
        </div>
      </div>
    </div>
  </div>

  <script src="/donate/js/main.js"></script>
</body>
</html>
