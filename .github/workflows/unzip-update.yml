name: Unzip update

# Chạy tay: tab Actions → "Unzip update" → Run workflow.
# Việc làm: giải nén update.zip (nằm ở GỐC repo) ra gốc repo → xóa update.zip → chạy prerender → commit + push.
#  • Zip bị bọc 1 thư mục ngoài cùng (vd shinjuvn.github.io-main/) → tự bỏ thư mục bọc.
#  • File trong .github/ (và .git/) bị BỎ QUA vì token của workflow không được phép sửa .github/workflows.
#  • Chặn đường dẫn nguy hiểm (../, đường dẫn tuyệt đối). File đè lên file cùng tên đã có.
#  • Lỗi ở bất kỳ bước giải nén nào → dừng, KHÔNG xóa update.zip, KHÔNG commit gì.

on:
  workflow_dispatch:

concurrency:
  group: prerender        # dùng chung nhóm với workflow Prerender → không chạy chồng, tránh đụng commit
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Giải nén update.zip
        run: |
          python3 - <<'PY'
          import os, sys, zipfile, shutil

          ROOT = os.path.realpath(".")
          ZIP = "update.zip"

          def fail(msg):
              print("::error::" + msg)
              sys.exit(1)

          if not os.path.isfile(ZIP):
              fail("Không thấy update.zip ở gốc repo. Hãy upload file này vào gốc repo rồi chạy lại.")
          if not zipfile.is_zipfile(ZIP):
              fail("update.zip không phải file zip hợp lệ (có thể upload dở hoặc hỏng).")

          with zipfile.ZipFile(ZIP) as z:
              bad = z.testzip()
              if bad:
                  fail("update.zip bị hỏng, lỗi ở: " + bad)

              files = [
                  i for i in z.infolist()
                  if not i.is_dir()
                  and not i.filename.startswith("__MACOSX/")
                  and os.path.basename(i.filename) not in (".DS_Store", "Thumbs.db")
              ]
              if not files:
                  fail("update.zip rỗng (không có file nào).")

              # Nhận biết thư mục bọc: chỉ có 1 thư mục ngoài cùng, và (tên bắt đầu bằng shinjuvn.github.io
              # hoặc thư mục đó CHƯA có ở gốc repo). Nếu tên trùng thư mục có sẵn (post, css, js, assets…)
              # thì đó là thư mục thật của site, KHÔNG bóc.
              tops = {i.filename.replace("\\", "/").split("/")[0] for i in files}
              strip = None
              if len(tops) == 1 and all("/" in i.filename.replace("\\", "/") for i in files):
                  top = next(iter(tops))
                  if not top.startswith(".") and (top.lower().startswith("shinjuvn.github.io") or not os.path.isdir(top)):
                      strip = top
              print("Thư mục bọc:", strip if strip else "(không có)")

              plan, skipped = [], []
              for i in files:                      # lượt 1: kiểm tra TOÀN BỘ đường dẫn trước, chưa ghi gì
                  rel = i.filename.replace("\\", "/")
                  if strip:
                      rel = rel[len(strip) + 1:]
                  parts = [p for p in rel.split("/") if p not in ("", ".")]
                  if not parts:
                      continue
                  if rel.startswith("/") or ".." in parts:
                      fail("Đường dẫn nguy hiểm trong zip: " + i.filename)
                  if parts[0] in (".git", ".github"):
                      skipped.append("/".join(parts))
                      continue
                  if parts == ["update.zip"]:
                      continue
                  dest = os.path.realpath(os.path.join(ROOT, *parts))
                  if not dest.startswith(ROOT + os.sep):
                      fail("Đường dẫn thoát khỏi repo: " + i.filename)
                  plan.append((i, dest, "/".join(parts)))

              written = []
              for i, dest, name in plan:           # lượt 2: ghi file
                  os.makedirs(os.path.dirname(dest), exist_ok=True)
                  with z.open(i) as src, open(dest, "wb") as out:
                      shutil.copyfileobj(src, out)
                  written.append(name)

          if skipped:
              print("::warning::Bỏ qua %d file trong .github/.git: %s" % (len(skipped), ", ".join(skipped[:10])))
          if not written:
              fail("Không giải nén được file nào (toàn bộ nằm trong .github/.git hoặc rỗng).")

          print("Đã giải nén %d file:" % len(written))
          for w in written[:200]:
              print("  " + w)
          if len(written) > 200:
              print("  … và %d file nữa" % (len(written) - 200))
          open("/tmp/unzip_count", "w").write(str(len(written)))
          PY

      # Tới đây giải nén đã thành công (bước trên không lỗi) → xóa zip.
      - name: Xóa update.zip
        run: rm -f update.zip

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Dựng lại HTML tĩnh / sitemap / llms.txt theo file vừa cập nhật.
      # Nếu prerender lỗi thì vẫn commit phần giải nén (không còn cron tự chạy lại: nếu lỗi, vào tab Actions bấm Run workflow ở Prerender, hoặc commit lại một file .json/.html bất kỳ).
      - name: Prerender
        continue-on-error: true
        run: node tools/prerender.js

      - name: Commit và push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Không có thay đổi nào để commit (file trong zip giống hệt bản đang có)."
            exit 0
          fi
          git commit -m "Update: giải nén update.zip ($(cat /tmp/unzip_count) file)"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            echo "Push lần $i lỗi, thử lại…"
            sleep 5
          done
          echo "::error::Push thất bại sau 3 lần"
          exit 1
