name: Deploy Pages (chạy tay)

# Bấm tay: tab Actions → "Deploy Pages (chạy tay)" → Run workflow.
# Deploy NGAY bản mới nhất của main: không chờ 5 phút, không kiểm tra gì, không phụ thuộc workflow tự động.
# (Settings → Pages → Source phải là "GitHub Actions".)

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    uses: ./.github/workflows/deploy-core.yml
    with:
      ref: main
