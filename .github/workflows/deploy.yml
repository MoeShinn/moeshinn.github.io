name: Deploy Pages

# Deploy nhanh: 1 job duy nhất (checkout → upload → deploy), không chờ gì cả.
# Tự chạy khi:
#  • push lên main (trừ commit chỉ đụng file không ảnh hưởng site)
#  • Prerender / Unzip update chạy xong thành công (commit của bot không kích hoạt được push nên phải bắt qua workflow_run)
#  • bấm tay: tab Actions → "Deploy Pages" → Run workflow
# Luôn deploy bản main MỚI NHẤT. Push mới sẽ hủy deploy đang chạy dở (hiện màu xám "cancelled", không phải lỗi);
# Prerender / Unzip update thì không hủy ai mà xếp hàng chờ.
# Settings → Pages → Source phải là "GitHub Actions".

on:
  push:
    branches: [main]
    paths-ignore:
      - ".github/**"
      - "tools/**"
      - "worker/**"
      - "update.zip"
      - "site-notify-state.json"   # Worker ghi mỗi giờ, site không đọc file này
  workflow_run:
    workflows: ["Prerender", "Unzip update"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    # workflow_run chỉ deploy khi workflow trước đó thành công
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: ${{ github.event_name == 'push' }}
    environment:
      name: github-pages
      url: ${{ steps.d2.outputs.page_url || steps.d1.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Chặn deploy bản rỗng
        run: |
          if [ ! -f index.html ]; then
            echo "::error::Không thấy index.html ở gốc repo (vừa Wipe, chưa Unzip?) → hủy deploy."
            exit 1
          fi
          rm -f update.zip

      - uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - id: d1
        uses: actions/deploy-pages@v4
        continue-on-error: true

      # Lỗi thật thì thử lại 1 lần ngay trong job này (bị hủy do push mới thì KHÔNG tính là lỗi)
      - name: Chờ rồi thử lại
        if: steps.d1.outcome == 'failure'
        run: sleep 20
      - id: d2
        if: steps.d1.outcome == 'failure'
        uses: actions/deploy-pages@v4
