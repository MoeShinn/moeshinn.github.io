name: Deploy Pages

# Deploy site lên GitHub Pages (Settings → Pages → Source phải là "GitHub Actions").
#
# Khi nào chạy:
#  • push lên main, hoặc Prerender / Unzip update chạy xong  → CHỜ đến khi commit gần nhất đã cách đủ 5 phút
#    (trong lúc chờ mà có commit mới thì lần chờ cũ tự hủy, đồng hồ tính lại từ commit mới nhất)
#  • bấm tay (Actions → Deploy Pages → Run workflow)         → deploy NGAY, không chờ
#  • mỗi 6 giờ (dự phòng)                                    → chỉ deploy nếu có commit mới hơn lần deploy
#                                                              thành công gần nhất, hoặc lần đó bị lỗi
#
# Chống deploy lặp:
#  • mọi lần chạy dùng chung 1 hàng chờ "gate" → chỉ còn đúng 1 lần chạy sống sót sau mỗi đợt commit
#  • Prerender commit xong (bot) sẽ làm đồng hồ 5 phút tính lại → sau 1 đợt sửa chỉ deploy 1 lần
#  • job deploy xếp hàng riêng, không bao giờ bị ngắt giữa chừng
#
# Không đưa "Wipe source" vào workflow_run để tránh deploy bản rỗng sau khi xóa sạch.

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Prerender", "Unzip update"]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "17 */6 * * *"      # giờ UTC
  workflow_dispatch:

env:
  QUIET_SECONDS: 300            # 5 phút không có commit mới thì mới deploy

permissions:
  contents: read
  pages: write
  id-token: write
  deployments: read             # để lần chạy theo lịch kiểm tra deploy gần nhất

jobs:
  gate:
    # workflow_run chỉ deploy khi workflow trước đó thành công
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: pages-gate
      cancel-in-progress: true  # lần chạy mới hơn thay thế lần đang chờ (hiện màu xám "cancelled", không phải lỗi)
    outputs:
      proceed: ${{ steps.result.outputs.proceed }}
      sha: ${{ steps.result.outputs.sha }}
    env:
      EVENT: ${{ github.event_name }}
      REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Chờ đến khi 5 phút không có commit mới
        if: github.event_name == 'push' || github.event_name == 'workflow_run'
        run: |
          while :; do
            git fetch --quiet --depth=1 origin main
            last=$(git log -1 --format=%ct FETCH_HEAD)
            now=$(date +%s)
            remain=$(( last + QUIET_SECONDS - now ))
            if [ "$remain" -gt "$QUIET_SECONDS" ]; then remain=$QUIET_SECONDS; fi   # phòng đồng hồ máy bạn lệch giờ
            if [ "$remain" -le 0 ]; then
              echo "Commit gần nhất đã cách đây $((now - last))s → đủ yên tĩnh, tiến hành deploy."
              break
            fi
            echo "Commit gần nhất cách đây $((now - last))s → chờ thêm ${remain}s…"
            sleep "$remain"
          done

      - name: Lần chạy theo lịch → bỏ qua nếu bản mới nhất đã được deploy
        id: schedule
        if: github.event_name == 'schedule'
        run: |
          git fetch --quiet --depth=1 origin main
          last_commit=$(git log -1 --format=%ct FETCH_HEAD)
          dep_id=$(gh api "repos/$REPO/deployments?environment=github-pages&per_page=1" --jq '.[0].id // empty' 2>/dev/null || true)
          if [ -n "$dep_id" ]; then
            state=$(gh api "repos/$REPO/deployments/$dep_id/statuses?per_page=1" --jq '.[0].state // empty' 2>/dev/null || true)
            created=$(gh api "repos/$REPO/deployments/$dep_id" --jq '.created_at' 2>/dev/null || true)
            dep_time=$(date -d "$created" +%s 2>/dev/null || echo 0)
            if [ "$state" = "success" ] && [ "$dep_time" -ge "$last_commit" ]; then
              echo "Deploy gần nhất thành công và mới hơn commit cuối → bỏ qua."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "Có commit chưa deploy, hoặc deploy gần nhất chưa thành công → deploy."
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Kết quả
        id: result
        run: |
          git fetch --quiet --depth=1 origin main
          echo "sha=$(git rev-parse FETCH_HEAD)" >> "$GITHUB_OUTPUT"
          if [ "${{ steps.schedule.outputs.skip }}" = "true" ]; then
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: gate
    if: needs.gate.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.sha }}   # đúng bản đã chờ xong, gồm cả commit của bot
      - uses: actions/upload-pages-artifact@v3
        with:
          path: "."

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: pages
      cancel-in-progress: false  # không ngắt deploy đang chạy dở
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Deploy lỗi thì thử lại 1 lần (dùng lại artifact đã build, không build lại)
  deploy-retry:
    needs: deploy
    if: ${{ always() && needs.deploy.result == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - run: sleep 90
      - id: deployment
        uses: actions/deploy-pages@v4
