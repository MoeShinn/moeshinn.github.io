name: Deploy Pages

# Deploy nhanh: 1 job duy nhất (checkout → upload → deploy), không chờ 5 phút.
# Chạy khi: push lên main (trừ commit chỉ đụng file không ảnh hưởng site), bấm tay, hoặc được workflow khác gọi
# (Prerender / Unzip update gọi vào đây vì commit của bot không tự kích hoạt được workflow push).
# Settings → Pages → Source phải là "GitHub Actions".

on:
  push:
    branches: [main]
    paths-ignore:
      - ".github/**"
      - "tools/**"
      - "worker/**"
      - "update.zip"
      - "site-notify-state.json"   # Worker ghi mỗi giờ, site không đọc file này
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Nhánh hoặc commit cần deploy
        type: string
        default: main

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pages: write
      id-token: write
    # Hàng chờ chung: đang deploy dở thì không ngắt; nhiều lần chạy xếp hàng sẽ chỉ giữ lần MỚI NHẤT
    # → commit dồn dập chỉ tốn 2 lần deploy (1 đang chạy + 1 bản mới nhất), không cần chờ yên tĩnh.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.d2.outputs.page_url || steps.d1.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 1

      - name: Chặn deploy bản rỗng
        run: |
          if [ ! -f index.html ]; then
            echo "::error::Không thấy index.html ở gốc repo (vừa Wipe, chưa Unzip?) → hủy deploy."
            exit 1
          fi
          rm -f update.zip

      - uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - id: d1
        uses: actions/deploy-pages@v4
        continue-on-error: true

      # Lỗi thì thử lại 1 lần ngay trong job này (dùng lại artifact, không tốn thêm runner)
      - name: Chờ rồi thử lại
        if: steps.d1.outcome == 'failure'
        run: sleep 20
      - id: d2
        if: steps.d1.outcome == 'failure'
        uses: actions/deploy-pages@v4
