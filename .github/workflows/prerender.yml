name: Prerender

# Không chạy khi push. Chỉ chạy:
#  • tự động mỗi ngày lúc 12:00 giờ Việt Nam (05:00 UTC; GitHub có thể trễ vài phút)
#  • hoặc bấm tay: tab Actions → "Prerender" → Run workflow
# Dựng xong có thay đổi (sitemap, llms.txt, HTML dựng sẵn…) → commit. Prerender xong thì workflow
# "Deploy Pages" tự chạy nhờ workflow_run. Muốn giờ khác thì đổi cron (giờ UTC = giờ VN trừ 7).

on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * *"

concurrency:
  group: prerender
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  prerender:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      # Runner có sẵn Node (prerender chỉ cần 18+) nên khỏi setup-node, đỡ vài giây
      - run: node tools/prerender.js
      - name: Commit nếu có thay đổi
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4; do
            git add -A
            if git diff --cached --quiet; then
              echo "Không có thay đổi để commit."
              exit 0
            fi
            git commit -m "Prerender: cập nhật nội dung dựng sẵn"
            if git pull --rebase origin main && git push; then
              exit 0
            fi
            echo "Push lần $i lỗi (có commit mới chen vào)."
            if [ "$i" -eq 4 ]; then break; fi
            git rebase --abort 2>/dev/null || true
            git fetch origin main
            git reset --hard origin/main
            node tools/prerender.js
            sleep $((i * 3))
          done
          echo "::error::Push thất bại sau 4 lần"
          exit 1
