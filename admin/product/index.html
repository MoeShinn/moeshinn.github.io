<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Sản phẩm</title>
<link rel="stylesheet" href="/admin/css/admin.css">
<style>
.th{width:44px;height:44px;border-radius:8px;background:#050b16 center/cover no-repeat;flex:none;border:1px solid var(--line);overflow:hidden;display:grid;place-items:center;font-size:11px;color:var(--mute)}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.badge{display:inline-block;font-size:11px;padding:1px 8px;border-radius:999px;margin-left:6px;vertical-align:middle;background:#16304f;border:1px solid #2a4a74}
.badge.p{background:#12391f;border-color:#23703a}
.sub{background:#0a1626;border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:10px}
.thumbbox{display:flex;gap:12px;align-items:flex-start}
.thumbbox .pv{width:96px;aspect-ratio:1/1;border-radius:10px;background:#050b16;border:1px solid var(--line);overflow:hidden;display:grid;place-items:center;color:var(--mute);font-size:12px;flex:none}
.thumbbox .pv img{width:100%;height:100%;object-fit:cover}
.mini{display:flex;gap:8px;align-items:center}.mini img{width:54px;height:54px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
a.act{cursor:pointer}a.dng{color:#ff8b8f}
/* Chọn nơi đặt (thay <select>): nút hiện đường dẫn + bảng chọn dạng cây */
.fld{display:grid;gap:4px;font-size:13px;color:var(--mute);margin-bottom:10px}
.pick{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:left;background:#0a1626;border:1px solid var(--line);border-radius:8px;padding:9px 10px;color:var(--text);min-height:44px}
.pk-path{display:flex;flex-wrap:wrap;align-items:center;gap:2px 6px;min-width:0;word-break:break-word}.pk-path i{font-style:normal;color:var(--mute)}
.pk-chg{flex:none;color:#7db4ff;font-size:13px}
.sheet-bg{position:fixed;inset:0;background:#000a;z-index:60;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);border:1px solid var(--line);border-radius:16px 16px 0 0;width:100%;max-width:560px;max-height:82vh;display:flex;flex-direction:column}
.sh-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.sh-b{overflow:auto;padding:6px 8px max(14px,env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
.pk{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:transparent;border:0;border-radius:10px;padding:10px 10px 10px calc(10px + var(--d,0)*18px);color:var(--text);min-height:46px}
.pk[hidden]{display:none}.pk:hover{background:#12233b}.pk.on{background:#14304f}
.pk-i{flex:none}.pk-l{flex:none;color:#4a6288;margin-right:-4px}
.pk-t{flex:1;min-width:0;display:grid}.pk-t b{font-weight:600;word-break:break-word}.pk-t small{color:var(--mute);font-size:12px}
.pk-r{flex:none;width:20px;height:20px;border-radius:50%;border:2px solid #4a6288}.pk.on .pk-r{border-color:#38d6ff;background:radial-gradient(#38d6ff 0 45%,transparent 50%)}
@media(min-width:721px){.sheet-bg{align-items:center}.sheet{border-radius:14px}}
/* Danh sách: duyệt từng thư mục (mỗi lần chỉ hiện 1 cấp) + tìm kiếm + menu ⋯ — số mục nhiều cũng không tràn */
.it{display:flex;align-items:center;gap:10px;padding:10px 6px;border-top:1px solid var(--line);cursor:pointer;border-radius:8px;min-height:64px}
.it:first-child{border-top:0}.it:hover{background:#12233b}
.it .nm{flex:1;min-width:0}
.it .nm b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.it .l2{display:flex;align-items:center;gap:6px;min-width:0}.it .l2 .badge{margin:0;flex:none}
.it .l2 small{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.it .chev{flex:none;color:var(--mute);font-size:22px;line-height:1}
.more{flex:none;width:40px;height:40px;padding:0;font-size:20px;line-height:1;border-radius:10px}
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;margin:4px 0 10px;min-height:40px}
.crumbs .cr{padding:6px 10px;border-radius:999px;background:#0a1626;border:1px solid var(--line);color:#7db4ff;cursor:pointer;font-size:13px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crumbs .cr.cur{background:#14304f;color:var(--text);cursor:default;font-weight:600}
.crumbs i{font-style:normal;color:var(--mute)}.crumbs .grow{flex:1}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.mi{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:transparent;border:0;border-radius:10px;padding:10px 12px;color:var(--text);min-height:48px;font:inherit;cursor:pointer}
.mi:hover{background:#12233b}.mi[disabled]{opacity:.35;pointer-events:none}.mi.dng{color:#ff8b8f}.mi .mi-i{width:22px;text-align:center;flex:none}
details.hub>summary{cursor:pointer;margin:0;font-weight:700}details.hub{border:0;padding:0}details.hub[open]>summary{margin-bottom:12px}
</style></head>
<body><div id="app"></div><div id="toast"></div>
<script src="/admin/js/core.js"></script>
<script src="/admin/js/seo.js"></script>
<script src="/admin/js/postgen.js"></script>
<script src="/admin/js/imgutil.js"></script>
<script src="/admin/js/imgpick.js"></script>
<script src="/post/js/render.js"></script>
<script src="/product/js/productgen.js"></script>
<script>
Admin.boot({ id: "product", title: "Sản phẩm", async render(main) {
  const { esc, $ } = Admin, PG = ProductGen, DATA = "product/data.json";
  main.innerHTML = `<h2>Sản phẩm</h2><p class="hint">Đang tải…</p>`;
  let idx, S, tree;
  try {
    [idx, S, tree] = await Promise.all([Admin.readJson(DATA, { title: "", intro: "", nodes: [] }), Admin.readJson("site-settings.json", {}), Admin.api("/tree").then((r) => r.files.map((f) => f.path))]);
  } catch (e) { main.innerHTML = `<h2>Sản phẩm</h2><p class="err">${esc(e.message)}</p>`; return; }
  idx.nodes = idx.nodes || [];
  const seo = AdminSeo.merge(S.seo), site = seo.siteUrl.replace(/\/$/, "");
  const today = () => new Date().toISOString().slice(0, 10);
  const LIMIT = 38; // Worker nhận tối đa 40 file mỗi commit
  const hubOf = (i = idx) => ({ title: i.title, intro: i.intro });
  const idxFile = (nodes) => ({ path: DATA, content: JSON.stringify({ ...(idx.title ? { title: idx.title } : {}), ...(idx.intro ? { intro: idx.intro } : {}), nodes }, null, 2) + "\n" });
  const label = (n) => PG.path(idx.nodes, n.id).map((x) => x.title).join(" › ");
  const readDetail = (id) => Admin.readJson(`product/data/${id}.json`, {});

  // Dựng trang tĩnh cho một mục (cần chi tiết của mục và các danh mục cha để kế thừa chính sách)
  async function pageFor(shell, id, nodes, over = {}) {
    const node = PG.find(nodes, id); if (!node) return null;
    const details = {};
    for (const n of PG.path(nodes, id)) details[n.id] = over[n.id] || (await readDetail(n.id));
    const d = details[id], bodyHtml = !PG.isCat(node) && d.body ? renderPostBody(d.body) : "";
    return { path: `product/${id}/index.html`, content: PG.buildNodePage(shell, { seo, node, nodes, details, bodyHtml, hub: hubOf() }) };
  }
  async function commit(message, files, deletes = []) {
    if (files.length + deletes.length > LIMIT) throw new Error(`Thay đổi này chạm ${files.length + deletes.length} file (tối đa ${LIMIT} mỗi lần). Hãy làm từng nhánh nhỏ hơn.`);
    await Admin.commitFiles(message, files, deletes);
  }
  const done = (msg, folder = "") => { Admin.toast(msg); setTimeout(() => { location.hash = folder ? "#in/" + encodeURIComponent(folder) : ""; location.reload(); }, 1600); };

  /* ---------------- Danh sách: duyệt từng thư mục ---------------- */
  let view = "list", q = "";
  const PAGE = 40; let lim = PAGE;
  const enc = encodeURIComponent;
  const fold = (t) => String(t || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/đ/g, "d").toLowerCase(); // tìm không phân biệt dấu
  const curFolder = () => { const h = location.hash; if (!h.startsWith("#in/")) return ""; const id = decodeURIComponent(h.slice(4)), n = PG.find(idx.nodes, id); return n && PG.isCat(n) ? id : ""; };
  const go = (id) => { const h = id ? "#in/" + enc(id) : ""; q = ""; lim = PAGE; if (location.hash === h) showList(); else location.hash = h; };

  function showList() {
    view = "list"; main.oninput = main.onchange = null;
    const cats = idx.nodes.filter((n) => PG.isCat(n)).length;
    main.innerHTML = `<h2>Sản phẩm</h2>
      <div class="card"><details class="hub"><summary>Trang chính /product/ <span class="hint" style="font-weight:400">· chạm để sửa tiêu đề</span></summary>
        <label>Tiêu đề trang<input id="h_title" value="${esc(idx.title || "")}" placeholder="Sản phẩm"></label>
        <label>Giới thiệu ngắn (hiện dưới tiêu đề, Google và AI đọc được)<textarea id="h_intro" rows="2">${esc(idx.intro || "")}</textarea></label>
        <button type="button" class="ghost" id="h_save">Lưu trang chính</button> <span class="hint">Tiêu đề / mô tả / từ khóa Google của trang này chỉnh ở Cài đặt → SEO.</span></details></div>
      <input id="q" type="search" placeholder="🔍 Tìm theo tên hoặc ID (không cần gõ dấu)…" value="${esc(q)}" autocomplete="off" style="margin-bottom:10px">
      <div id="crumbs" class="crumbs"></div><div id="bar" class="toolbar"></div>
      <div class="card" id="rows" style="padding:6px 8px"></div><p class="hint" id="foot"></p>`;
    const drawRows = () => {
      const cur = curFolder(), query = fold(q.trim());
      let list;
      if (query) list = idx.nodes.filter((n) => fold(n.title).includes(query) || fold(n.id).includes(query)).sort((x, y) => fold(PG.path(idx.nodes, x.id).map((z) => z.title).join(" ")).localeCompare(fold(PG.path(idx.nodes, y.id).map((z) => z.title).join(" "))));
      else list = PG.children(idx.nodes, cur);
      // thanh đường dẫn (hoặc tiêu đề kết quả tìm kiếm)
      if (query) $("#crumbs").innerHTML = `<span class="hint">Kết quả cho “${esc(q.trim())}”: ${list.length} mục</span>`;
      else {
        const full = cur ? PG.path(idx.nodes, cur) : [], path = full.slice(-2), hidden = full.length - path.length; // đường dẫn sâu: chỉ hiện 2 cấp cuối, “…” để lùi lên
        $("#crumbs").innerHTML = `<span class="cr${cur ? "" : " cur"}" ${cur ? 'data-go=""' : ""}>🏠 Gốc</span>` + (hidden ? `<i>›</i><span class="cr" data-go="${esc(full[hidden - 1].id)}" title="Lùi lên">…</span>` : "") + path.map((n, i) => `<i>›</i><span class="cr${i === path.length - 1 ? " cur" : ""}" ${i === path.length - 1 ? "" : `data-go="${esc(n.id)}"`}>${esc(n.title)}</span>`).join("") + (cur ? `<span class="grow"></span><button type="button" class="ghost more" data-more="${esc(cur)}" title="Tác vụ của danh mục này">⋯</button>` : "");
      }
      $("#bar").innerHTML = query ? "" : `<a class="btn" href="#new/category/${enc(cur)}">＋ Danh mục</a><a class="btn" href="#new/product/${enc(cur)}" style="background:#12391f">＋ Sản phẩm</a>`;
      const row = (n) => {
        const cat = PG.isCat(n), kids = cat ? PG.children(idx.nodes, n.id).length : 0;
        const where = query ? PG.path(idx.nodes, n.id).slice(0, -1).map((z) => z.title).join(" › ") : "";
        return `<div class="it" data-open="${esc(n.id)}"><div class="th">${n.thumb ? `<img src="${esc(n.thumb)}" alt="" loading="lazy" onerror="this.replaceWith(document.createTextNode('—'))">` : "—"}</div>
          <div class="nm"><b>${esc(n.title)}</b><div class="l2"><span class="badge ${cat ? "" : "p"}">${cat ? "Danh mục · " + kids : "Sản phẩm"}</span><small class="hint">${where ? esc(where) + " · " : ""}/product/${esc(n.id)}/</small></div></div>
          ${cat ? '<span class="chev">›</span>' : ""}<button type="button" class="ghost more" data-more="${esc(n.id)}" aria-label="Tác vụ">⋯</button></div>`;
      };
      $("#rows").innerHTML = list.slice(0, lim).map(row).join("") || `<p class="hint" style="margin:10px">${query ? "Không có kết quả phù hợp." : cur ? "Danh mục này đang trống. Bấm “＋ Danh mục” hoặc “＋ Sản phẩm” ở trên để thêm vào đây." : "Chưa có mục nào. Bấm “＋ Danh mục” để bắt đầu (ví dụ: Phần mềm, Model Ezy Tuber)."}</p>`;
      if (list.length > lim) $("#rows").innerHTML += `<button type="button" class="ghost" id="more_btn" style="width:100%;margin:6px 0">Xem thêm (còn ${list.length - lim})</button>`;
      $("#foot").textContent = `Tổng cộng ${cats} danh mục, ${idx.nodes.length - cats} sản phẩm. Chạm vào danh mục để mở, vào sản phẩm để sửa; nút ⋯ để đổi thứ tự, thêm mục con hoặc xóa.`;
    };
    drawRows();
    $("#q").oninput = (e) => { q = e.target.value; lim = PAGE; drawRows(); };
    main.onclick = (e) => {
      const t = e.target;
      if (t.closest("#more_btn")) { lim += PAGE; return drawRows(); }
      const more = t.closest("[data-more]"); if (more) return openMenu(more.dataset.more);
      const crumb = t.closest("[data-go]"); if (crumb) return go(crumb.dataset.go);
      const it = t.closest("[data-open]"); if (!it || t.closest("a")) return;
      const n = PG.find(idx.nodes, it.dataset.open); if (!n) return;
      if (PG.isCat(n)) go(n.id); else location.hash = "#edit/" + enc(n.id);
    };
    $("#h_save").onclick = async () => {
      const b = $("#h_save"); b.disabled = true;
      try { idx.title = $("#h_title").value.trim(); idx.intro = $("#h_intro").value.trim(); await commit("Admin: sửa trang chính Sản phẩm", [idxFile(idx.nodes)]); done("Đã lưu. Web cập nhật sau ~1 phút.", curFolder()); }
      catch (e) { Admin.toast(e.message, true); b.disabled = false; }
    };
  }

  // Bảng tác vụ của một mục (thay cho hàng loạt link trên mỗi dòng)
  function openMenu(id) {
    const n = PG.find(idx.nodes, id); if (!n) return;
    const cat = PG.isCat(n), sib = PG.children(idx.nodes, n.parent || ""), i = sib.findIndex((x) => x.id === id), e = enc(id);
    const el = document.createElement("div"); el.className = "sheet-bg";
    el.innerHTML = `<div class="sheet" role="dialog" aria-label="Tác vụ"><div class="sh-h"><div style="min-width:0"><b style="word-break:break-word">${esc(n.title)}</b><div class="hint">/product/${esc(id)}/</div></div><button type="button" class="ghost" data-x>Đóng</button></div><div class="sh-b">
      <a class="mi" href="/product/${e}/" target="_blank" rel="noopener"><span class="mi-i">↗</span>Mở trang</a>
      <a class="mi" href="#edit/${e}"><span class="mi-i">✎</span>Sửa / đổi vị trí</a>
      ${cat ? `<a class="mi" href="#new/category/${e}"><span class="mi-i">＋</span>Thêm danh mục con</a><a class="mi" href="#new/product/${e}"><span class="mi-i">＋</span>Thêm sản phẩm vào đây</a>` : ""}
      <button type="button" class="mi" data-a="up" ${i <= 0 ? "disabled" : ""}><span class="mi-i">↑</span>Đưa lên</button>
      <button type="button" class="mi" data-a="down" ${i === sib.length - 1 ? "disabled" : ""}><span class="mi-i">↓</span>Đưa xuống</button>
      <button type="button" class="mi dng" data-a="del"><span class="mi-i">🗑</span>Xóa${cat ? " (cả mục bên trong)" : ""}</button></div></div>`;
    const onkey = (ev) => { if (ev.key === "Escape") close(); }, close = () => { el.remove(); document.removeEventListener("keydown", onkey); };
    document.addEventListener("keydown", onkey);
    el.onclick = async (ev) => {
      if (ev.target === el || ev.target.closest("[data-x]")) return close();
      if (ev.target.closest("a")) return close(); // link: để trình duyệt tự điều hướng
      const a = ev.target.closest("[data-a]"); if (!a) return;
      close();
      if (a.dataset.a === "del") return removeNode(id);
      await moveNode(id, a.dataset.a === "up" ? -1 : 1);
    };
    document.body.appendChild(el);
  }

  async function moveNode(id, dir) {
    const n = PG.find(idx.nodes, id), sib = PG.children(idx.nodes, n.parent || ""), i = sib.findIndex((x) => x.id === id), j = i + dir;
    if (j < 0 || j >= sib.length) return;
    const nodes = idx.nodes.map((x) => ({ ...x })), A = PG.find(nodes, sib[i].id), B = PG.find(nodes, sib[j].id);
    sib.forEach((s, k) => (PG.find(nodes, s.id).order = k)); [A.order, B.order] = [B.order, A.order];
    try { Admin.toast("Đang lưu thứ tự…"); await commit("Admin: đổi thứ tự trong Sản phẩm", [idxFile(nodes)]); done("Đã đổi thứ tự.", n.parent || ""); } catch (e) { Admin.toast(e.message, true); }
  }

  async function removeNode(id) {
    const n = PG.find(idx.nodes, id), kids = PG.descendants(idx.nodes, id), all = [n].concat(kids);
    if (!confirm(`Xóa “${n.title}”${kids.length ? ` và ${kids.length} mục bên trong nó` : ""}? Trang của các mục này sẽ bị xóa.`)) return;
    const gone = new Set(all.map((x) => x.id)), nodes = idx.nodes.filter((x) => !gone.has(x.id));
    const deletes = all.flatMap((x) => [`product/data/${x.id}.json`, `product/${x.id}/index.html`]).filter((p) => tree.includes(p));
    try {
      const shell = await Admin.readText("product/index.html"), files = [idxFile(nodes)];
      if (n.parent && PG.find(nodes, n.parent)) files.push(await pageFor(shell, n.parent, nodes));
      await commit(`Admin: xóa ${all.length} mục sản phẩm`, files, deletes);
      done("Đã xóa. Web cập nhật sau ~1 phút.", n.parent && PG.find(nodes, n.parent) ? n.parent : "");
    } catch (e) { Admin.toast(e.message, true); }
  }

  /* ---------------- Trình soạn ---------------- */
  async function showEditor(editId, newType, newParent) {
    view = "edit";
    const old = editId ? PG.find(idx.nodes, editId) : null;
    if (editId && !old) { location.hash = ""; return; }
    main.innerHTML = `<h2>Đang tải…</h2>`;
    const type = old ? old.type : newType, cat = type === "category";
    let d = old ? await readDetail(editId) : {};
    const n0 = old || { type, parent: newParent || "", title: "", thumb: "" };
    let gallery = (d.gallery || []).map((u) => ({ url: u })), btns = (d.buttons || []).map((b) => ({ ...b })), lics = (d.licenses || []).map((l) => ({ ...l }));
    let thumb = n0.thumb || "", thumbPv = thumb;
    const banned = old ? new Set([old.id].concat(PG.descendants(idx.nodes, old.id).map((x) => x.id))) : new Set();
    main.innerHTML = `<h2>${old ? "Sửa" : "Thêm"} ${cat ? "danh mục" : "sản phẩm"} <a href="#" style="font-size:14px;margin-left:8px">← Danh sách</a></h2>
    <div class="card">
      <label>Tên ${cat ? "danh mục" : "sản phẩm"}<input id="e_title" value="${esc(n0.title)}"></label>
      <label>ID / đường dẫn (${esc(site)}/product/…)<input id="e_id" ${old ? "readonly" : ""} value="${esc(editId || "")}" placeholder="để trống: tự tạo từ tên, ví dụ picture-lite"></label>
      <div class="fld">Nằm trong<input type="hidden" id="e_parent" value="${esc(n0.parent || "")}"><button type="button" class="pick" id="e_ppick"><span class="pk-path" id="e_ppath"></span><span class="pk-chg">Đổi ▾</span></button></div>
      <label>Ảnh thumbnail (hiện trên thẻ và khi chia sẻ link)</label>
      <div class="thumbbox"><div class="pv" id="e_pv">chưa có ảnh</div><div style="flex:1"><input id="e_thumb" placeholder="/image/xxxxxxxx.webp hoặc https://…" value="${esc(thumb)}"><div style="margin-top:6px"><button type="button" class="ghost" id="e_pick">Chọn / tải ảnh lên</button> <button type="button" class="ghost" id="e_nothumb">Bỏ ảnh</button></div></div></div>
    </div>
    <div class="card"><h3>Để Google và AI hiểu trang này</h3>
      <label>Mô tả ngắn (1–2 câu nói rõ trang chứa gì — hiện trên Google và là thứ AI đọc đầu tiên)<textarea id="e_desc" rows="3">${esc(d.description || "")}</textarea></label>
      <label>Từ khóa (cách nhau bằng dấu phẩy)<input id="e_kw" value="${esc(d.keywords || "")}"></label>
      <button type="button" class="ghost" id="e_ai">✨ AI gợi ý mô tả và từ khóa</button> <span class="hint">AI chỉ điền gợi ý, ông xem lại rồi mới lưu.</span></div>
    ${cat ? "" : `<div class="card"><h3>Thông tin sản phẩm</h3>
      <label>Giá (tuỳ chọn, ví dụ: Miễn phí, 50.000đ)<input id="e_price" value="${esc(d.price || "")}" placeholder="Miễn phí"></label>
      <div class="fld" style="margin:10px 0 4px">Chữ nổi bật dưới ảnh (tích 1, cả 2 hoặc không cái nào)
        <label class="row"><input type="checkbox" id="e_il" ${d.illustrative === true ? "checked" : ""}>⚠️ Hình ảnh chỉ mang tính chất minh hoạ</label>
        <label class="row"><input type="checkbox" id="e_aiimg" ${d.aiImage === true ? "checked" : ""}>🤖 Ảnh được tạo bởi AI</label></div>
      <label>Nội dung giới thiệu (Markdown-lite giống bài đăng: ảnh, link, nút, mã màu §a…)</label>
      <div class="tb"><button type="button" data-ins="img">🖼 Ảnh</button><button type="button" data-ins="link">🔗 Link</button><button type="button" data-ins="btn">🔘 Nút</button><button type="button" data-ins="b">B Đậm</button><button type="button" data-ins="color">🎨 Màu</button><button type="button" class="ghost" id="e_prev">👁 Xem trước</button></div>
      <div id="e_sw" style="display:none;gap:4px;flex-wrap:wrap;margin:6px 0"></div>
      <textarea id="e_body" rows="12" style="font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px">${esc(d.body || "")}</textarea>
      <div id="e_pvw" style="display:none;margin-top:8px"><iframe id="e_pvf" style="width:100%;height:340px;border:1px solid var(--line);border-radius:8px;background:#050b16"></iframe></div></div>
    <div class="card"><h3>Hình ảnh thêm (thư viện)</h3><div id="e_gal"></div><button type="button" class="ghost" id="g_add">＋ Thêm ảnh</button></div>
    <div class="card"><h3>Nút trên trang sản phẩm</h3><p class="hint" style="margin-top:0">Ví dụ “Tải xuống” (dán link /download/… hoặc link ngoài), “Mua ngay”, “Xem trên YouTube”…</p><div id="e_btns"></div><button type="button" class="ghost" id="b_add">＋ Thêm nút</button>
      <label class="row" style="margin-top:12px"><input type="checkbox" id="e_cs" ${d.consent === false ? "" : "checked"}>Bắt khách <b>tích “đồng ý chính sách &amp; giấy phép”</b> (có nút xem chính sách ngay trong popup) trước khi mở link của các nút này</label>
      <p class="hint" style="margin:4px 0 0">Chỉ có tác dụng khi trang này có hoặc kế thừa chính sách (khung “Chính sách / Giấy phép” bên dưới, hoặc của danh mục cha). Không có chính sách thì nút mở link bình thường.</p></div>`}
    <div class="card"><h3>Chính sách / Giấy phép</h3>
      <p class="hint" style="margin-top:0">Tự viết nội dung. Có thể thêm <b>nhiều khối</b> (giấy phép kép — ví dụ phần mình chịu trách nhiệm và phần điều khoản của nguồn gốc). ${cat ? "Các mục con không tự viết chính sách sẽ tự áp dụng chính sách của danh mục này." : "Nếu để trống, sản phẩm tự áp dụng chính sách của danh mục cha gần nhất có viết."}</p>
      <div id="e_lic"></div><button type="button" class="ghost" id="l_add">＋ Thêm khối chính sách</button></div>
    ${cat ? "" : `<div class="card"><label class="row"><input type="checkbox" id="e_cm" ${d.comments === false ? "" : "checked"}>Cho phép bình luận (Giscus) ở trang này</label></div>`}
    <button id="e_save">${old ? "Lưu thay đổi" : cat ? "Tạo danh mục" : "Đăng sản phẩm"}</button> <span class="hint" id="e_st"></span>`;

    const move = (arr, i, k) => { const j = i + k; if (j < 0 || j >= arr.length) return; [arr[i], arr[j]] = [arr[j], arr[i]]; };
    const ctl = (kind, i, n) => `<span style="white-space:nowrap"><button type="button" class="ghost" data-mv="${kind}:${i}:-1" ${i === 0 ? "disabled" : ""}>↑</button> <button type="button" class="ghost" data-mv="${kind}:${i}:1" ${i === n - 1 ? "disabled" : ""}>↓</button> <button type="button" class="ghost" data-rm="${kind}:${i}">✕</button></span>`;
    const arrOf = (k) => (k === "gal" ? gallery : k === "btn" ? btns : lics);
    function drawThumb() { $("#e_pv").innerHTML = thumbPv ? `<img src="${esc(thumbPv)}" alt="" onerror="this.replaceWith(document.createTextNode('Đang xuất bản…'))">` : "chưa có ảnh"; }
    function draw() {
      drawThumb();
      if ($("#e_gal")) $("#e_gal").innerHTML = gallery.map((g, i) => `<div class="sub mini"><img src="${esc(g.pv || g.url)}" alt="" onerror="this.style.opacity=.3"><input style="flex:1" data-f="gal:${i}" value="${esc(g.url)}">${ctl("gal", i, gallery.length)}</div>`).join("") || '<p class="hint">Chưa có ảnh thêm.</p>';
      if ($("#e_btns")) $("#e_btns").innerHTML = btns.map((b, i) => `<div class="sub"><div class="cols"><label>Chữ trên nút<input data-f="btn:${i}:label" value="${esc(b.label || "")}"></label><label>Link<input data-f="btn:${i}:url" placeholder="https://… hoặc /download/…/" value="${esc(b.url || "")}"></label></div>
        <label>Màu nút<select data-f="btn:${i}:style">${[["blue", "Xanh dương"], ["green", "Xanh lá"], ["red", "Đỏ"], ["gray", "Xám"]].map(([v, l]) => `<option value="${v}" ${(b.style || "blue") === v ? "selected" : ""}>${l}</option>`).join("")}</select></label><div style="text-align:right">${ctl("btn", i, btns.length)}</div></div>`).join("") || '<p class="hint">Chưa có nút.</p>';
      $("#e_lic").innerHTML = lics.map((l, i) => `<div class="sub"><label>Tiêu đề khối (ví dụ: Giấy phép sử dụng)<input data-f="lic:${i}:title" value="${esc(l.title || "")}"></label><label>Nội dung<textarea rows="6" data-f="lic:${i}:text">${esc(l.text || "")}</textarea></label><div style="text-align:right">${ctl("lic", i, lics.length)}</div></div>`).join("") || '<p class="hint">Chưa có chính sách riêng.</p>';
    }
    main.oninput = (e) => {
      const f = e.target.dataset.f; if (f) { const [k, i, p] = f.split(":"); if (k === "gal") { gallery[+i].url = e.target.value; gallery[+i].pv = ""; } else arrOf(k)[+i][p] = e.target.value; }
      if (e.target.id === "e_thumb") { thumb = e.target.value.trim(); thumbPv = thumb; drawThumb(); }
    };
    main.onchange = (e) => { const f = e.target.dataset.f; if (f && f.startsWith("btn:") && f.endsWith(":style")) btns[+f.split(":")[1]].style = e.target.value; };
    main.onclick = (e) => {
      const t = e.target;
      if (t.dataset.mv) { const [k, i, s] = t.dataset.mv.split(":"); move(arrOf(k), +i, +s); draw(); }
      if (t.dataset.rm) { const [k, i] = t.dataset.rm.split(":"); arrOf(k).splice(+i, 1); draw(); }
      if (t.dataset.ins) insert(t.dataset.ins);
    };
    let insert = () => {};
    const pick = (cb) => ImgPick.open({ Admin, onPick: cb });
    $("#e_pick").onclick = () => pick((u, pv) => { thumb = u; thumbPv = pv; $("#e_thumb").value = u; drawThumb(); });
    $("#e_nothumb").onclick = () => { thumb = ""; thumbPv = ""; $("#e_thumb").value = ""; drawThumb(); };
    if (!cat) {
      $("#g_add").onclick = () => pick((u, pv) => { gallery.push({ url: u, pv }); draw(); });
      $("#b_add").onclick = () => { btns.push({ label: "Tải xuống", url: "", style: "blue" }); draw(); };
      const ta = $("#e_body");
      const put = (before, mid, after = "") => { const s = ta.selectionStart, e = ta.selectionEnd, sel = ta.value.slice(s, e) || mid; ta.setRangeText(before + sel + after, s, e, "end"); ta.focus(); };
      insert = (kind) => {
        if (kind === "img") return pick((u) => put(`\n\n![${$("#e_title").value.trim()}](`, u, ")\n\n"));
        if (kind === "link") { const u = prompt("Link (https://… hoặc /đường-dẫn):"); if (u) put("[", "chữ hiển thị", `](${u})`); }
        if (kind === "btn") { const u = prompt("Link của nút:"); if (u) put(`\n\n<a class="btn" href="${u.replace(/"/g, "%22")}" target="_blank" rel="noopener noreferrer">`, "Chữ trên nút", "</a>\n\n"); }
        if (kind === "b") put("§l", "chữ đậm", "§r");
        if (kind === "color") {
          const sw = $("#e_sw");
          if (!sw.childElementCount) Object.entries(typeof MC_COLORS === "object" ? MC_COLORS : {}).forEach(([k, c]) => { const i = document.createElement("i"); i.style.cssText = `display:inline-block;width:22px;height:22px;border-radius:5px;cursor:pointer;border:1px solid var(--line);background:${c}`; i.title = "§" + k; i.onclick = () => put("§" + k, "chữ màu", "§r"); sw.appendChild(i); });
          sw.style.display = sw.style.display === "none" ? "flex" : "none";
        }
      };
      $("#e_prev").onclick = () => {
        const w = $("#e_pvw"); w.style.display = w.style.display === "none" ? "" : "none";
        $("#e_pvf").srcdoc = `<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="/product/css/style.css"></head><body><div class="page" style="min-height:0;padding:16px"><div class="post-body product-body">${renderPostBody(ta.value)}</div></div></body></html>`;
      };
    }
    $("#l_add").onclick = () => { lics.push({ title: "", text: "" }); draw(); };
    $("#e_ai").onclick = async () => {
      const b = $("#e_ai"); b.disabled = true;
      try {
        const r = await Admin.api("/ai/seo", { title: $("#e_title").value, body: `${cat ? "Danh mục" : "Sản phẩm số"} trên website Shinju Ch. ${$("#e_desc").value} ${$("#e_body") ? $("#e_body").value : ""} ${$("#e_kw").value}`.slice(0, 6000) });
        if (r.description) $("#e_desc").value = r.description; if (r.keywords) $("#e_kw").value = [].concat(r.keywords).join(", ");
        Admin.toast("AI đã điền gợi ý, xem lại rồi lưu.");
      } catch (err) { Admin.toast(err.message, true); } b.disabled = false;
    };

    $("#e_save").onclick = async () => {
      const v = (i) => ($("#" + i) ? $("#" + i).value.trim() : ""), title = v("e_title").replace(/\s+/g, " ");
      if (!title) return Admin.toast("Cần nhập tên", true);
      const parent = v("e_parent");
      if (parent && banned.has(parent)) return Admin.toast("Không thể đặt một mục vào chính nó hoặc mục con của nó", true);
      const th = $("#e_thumb").value.trim();
      if (th && !/^(https?:\/\/|\/(?!\/))/.test(th)) return Admin.toast("Ảnh thumbnail phải là link https://… hoặc đường dẫn bắt đầu bằng /", true);
      const isUrl = (u) => /^(https?:\/\/|mailto:|tel:|\/(?!\/))/i.test(String(u || "").trim());
      const gal = gallery.map((g) => String(g.url || "").trim()).filter(Boolean), bt = btns.filter((b) => (b.label || "").trim() || (b.url || "").trim());
      if (gal.some((u) => !/^(https?:\/\/|\/(?!\/))/.test(u))) return Admin.toast("Ảnh trong thư viện phải là link https://… hoặc đường dẫn bắt đầu bằng /", true);
      for (const [i, b] of bt.entries()) if (!isUrl(b.url)) return Admin.toast(`Nút ${i + 1}: link phải bắt đầu bằng https://, / , mailto: hoặc tel:`, true);
      const used = new Set(idx.nodes.map((n) => n.id));
      let id = editId;
      if (!id) {
        const typed = v("e_id") && PostGen.slugify(v("e_id"));
        if (typed) { if (!PG.slugOk(typed)) return Admin.toast(`ID “${typed}” không dùng được (chữ thường, số, dấu -, không trùng css/js/data/index)`, true); if (used.has(typed)) return Admin.toast("ID này đã có mục khác dùng", true); id = typed; }
        else { let base = PostGen.slugify(title).slice(0, 56).replace(/-+$/, "") || "muc"; if (PG.RESERVED.includes(base)) base += "-sp"; id = base; for (let k = 2; used.has(id); k++) id = `${base}-${k}`; }
      }
      const nodes = idx.nodes.map((n) => ({ ...n }));
      const sibs = nodes.filter((n) => (n.parent || "") === parent && n.id !== id);
      const prev = old && (old.parent || "") === parent ? old.order : (sibs.reduce((m, n) => Math.max(m, n.order ?? 0), -1) + 1);
      const node = { id, type, parent, title, thumb: th, order: prev ?? 0, updated: today() };
      if (old) nodes[nodes.findIndex((n) => n.id === id)] = node; else nodes.push(node);
      const det = { ...d }; for (const k of ["price", "body", "gallery", "buttons", "licenses", "description", "keywords", "comments", "consent", "illustrative", "aiImage"]) delete det[k];
      const put = (k, val) => { if (val) det[k] = val; };
      put("description", v("e_desc")); put("keywords", v("e_kw"));
      const lc = lics.map((l) => ({ title: (l.title || "").trim(), text: (l.text || "").trim() })).filter((l) => l.title || l.text); if (lc.length) det.licenses = lc;
      if (!cat) {
        put("price", v("e_price")); if (det.price) node.price = det.price; /* giá cũng ghi vào node để thẻ sản phẩm hiện giá mà không phải tải từng file chi tiết */
        put("body", $("#e_body").value.replace(/\r\n/g, "\n").trim());
        if ($("#e_il").checked) det.illustrative = true;
        if ($("#e_aiimg").checked) det.aiImage = true;
        if (gal.length) det.gallery = gal;
        if (bt.length) det.buttons = bt.map((b) => ({ label: (b.label || "").trim() || "Mở liên kết", url: b.url.trim(), style: b.style || "blue" }));
        if (!$("#e_cm").checked) det.comments = false;
        if (!$("#e_cs").checked) det.consent = false;
      }
      const b = $("#e_save"); b.disabled = true; $("#e_st").textContent = "Đang lưu…";
      try {
        const shell = await Admin.readText("product/index.html"), files = [idxFile(nodes), { path: `product/data/${id}.json`, content: JSON.stringify(det, null, 2) + "\n" }];
        files.push(await pageFor(shell, id, nodes, { [id]: det }));
        for (const p of new Set([parent, old && old.parent || ""].filter((x) => x && PG.find(nodes, x)))) files.push(await pageFor(shell, p, nodes)); // trang danh mục cha (cũ và mới) liệt kê mục này
        await commit(`Admin: ${old ? "sửa" : "thêm"} ${cat ? "danh mục" : "sản phẩm"} ${id}`, files);
        done(`Đã ${old ? "lưu" : "đăng"}: ${site}/product/${id}/ (hoạt động sau ~1 phút)`, parent);
      } catch (err) { $("#e_st").textContent = ""; Admin.toast(err.message, true); b.disabled = false; }
    };
    // Chọn nơi đặt: bảng dạng cây (thụt lề theo cấp, tên ngắn) thay cho danh sách đường dẫn dài
    if ($("#e_parent").value && !PG.find(idx.nodes, $("#e_parent").value)) $("#e_parent").value = ""; // mục cha cũ đã không còn
    const drawParent = () => {
      const pid = $("#e_parent").value, p = pid ? PG.path(idx.nodes, pid) : [];
      $("#e_ppath").innerHTML = `<span>🏠 Gốc</span>` + p.map((x) => `<i>›</i><span>${esc(x.title)}</span>`).join("");
    };
    $("#e_ppick").onclick = () => {
      const cur = $("#e_parent").value, rows = [];
      const walk = (pid, d) => PG.children(idx.nodes, pid).filter((n) => PG.isCat(n) && !banned.has(n.id)).forEach((n) => { rows.push([n, d]); walk(n.id, d + 1); });
      walk("", 0);
      const el = document.createElement("div"); el.className = "sheet-bg";
      el.innerHTML = `<div class="sheet" role="dialog" aria-label="Chọn nơi đặt"><div class="sh-h"><b>Chọn nơi đặt</b><button type="button" class="ghost" data-x>Đóng</button></div>${rows.length > 8 ? '<div style="padding:8px 12px 0"><input type="search" id="pk_q" placeholder="🔍 Tìm danh mục…" autocomplete="off"></div>' : ""}<div class="sh-b">
        <button type="button" class="pk ${cur === "" ? "on" : ""}" data-v=""><span class="pk-i">🏠</span><span class="pk-t"><b>Gốc</b><small>Ngay trang Sản phẩm</small></span><span class="pk-r"></span></button>
        ${rows.map(([n, d]) => `<button type="button" class="pk ${n.id === cur ? "on" : ""}" data-v="${esc(n.id)}" data-t="${esc(fold(n.title + " " + n.id))}" style="--d:${d}"><span class="pk-i">📁</span>${d ? '<span class="pk-l">└</span>' : ""}<span class="pk-t"><b>${esc(n.title)}</b></span><span class="pk-r"></span></button>`).join("")}
        ${rows.length ? "" : '<p class="hint" style="padding:0 10px">Chưa có danh mục nào nên mục này sẽ nằm ở Gốc.</p>'}
      </div></div>`;
      const onkey = (e) => { if (e.key === "Escape") close(); }, close = () => { el.remove(); document.removeEventListener("keydown", onkey); };
      document.addEventListener("keydown", onkey);
      el.onclick = (e) => {
        if (e.target === el || e.target.closest("[data-x]")) return close();
        const b = e.target.closest("[data-v]"); if (!b) return;
        $("#e_parent").value = b.dataset.v; drawParent(); close();
      };
      document.body.appendChild(el);
      const pq = el.querySelector("#pk_q");
      if (pq) pq.oninput = () => { const k = fold(pq.value.trim()); el.querySelectorAll(".pk").forEach((b) => { b.hidden = !!k && (b.dataset.v === "" || !(b.dataset.t || "").includes(k)); }); };
      const on = el.querySelector(".pk.on"); if (on) on.scrollIntoView({ block: "center" });
    };
    drawParent();
    draw();
  }

  const show = () => {
    const h = location.hash;
    if (h.startsWith("#new/")) { const [, t, p] = h.split("/"); showEditor(null, t === "product" ? "product" : "category", p ? decodeURIComponent(p) : ""); }
    else if (h.startsWith("#edit/")) showEditor(decodeURIComponent(h.slice(6)));
    else showList();
  };
  addEventListener("hashchange", () => { const h = location.hash; if (view === "list" && (h === "" || h.startsWith("#in/"))) showList(); else location.reload(); }); show();
}});
</script></body></html>
