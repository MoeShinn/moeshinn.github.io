<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Hồ sơ Vtuber</title>
<link rel="stylesheet" href="/admin/css/admin.css">
<style>
.sec{border-left:3px solid #f5c518}.sub{background:#0a1626;border-left:3px solid var(--blue)}
.sec>summary{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tools{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.tools button{padding:6px 10px}
.imgf{margin-bottom:10px}.imgf .row{flex-wrap:wrap;gap:6px}
.thumb{height:56px;max-width:120px;object-fit:contain;border-radius:8px;border:1px solid var(--line);background:#fff}
.kv{display:grid;grid-template-columns:1fr 2fr auto;gap:6px;align-items:center;margin-bottom:6px}
.kv input{margin:0}.kv .tools{flex-wrap:nowrap}
.chip{display:inline-flex;align-items:center;gap:6px;background:#0a1626;border:1px solid var(--line);border-radius:999px;padding:3px 10px;margin:0 6px 6px 0;font-size:13px}
.pvf{width:100%;height:620px;border:1px solid var(--line);border-radius:10px;background:#fff}
.colors{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:720px){.kv{grid-template-columns:1fr}.colors{grid-template-columns:1fr}}
</style></head>
<body><div id="app"></div><div id="toast"></div>
<script src="/js/icons.js"></script>
<script src="/admin/js/core.js"></script>
<script src="/admin/js/imgutil.js"></script>
<script src="/admin/js/imgpick.js"></script>
<script src="/profile/js/profilegen.js"></script>
<script>
Admin.boot({ id: "profile", title: "Hồ sơ Vtuber", async render(main) {
  const { esc, $ } = Admin, PG = ProfileGen, PATH = "profile/data.json";
  main.innerHTML = `<h2>Hồ sơ Vtuber</h2><p class="hint">Đang tải…</p>`;
  let raw, channel;
  try { [raw, channel] = await Promise.all([Admin.readJson(PATH, PG.defaults()), Admin.readJson("channel/data.json", { links: [] }).catch(() => ({ links: [] }))]); }
  catch (e) { main.innerHTML = `<h2>Hồ sơ Vtuber</h2><p class="err">${esc(e.message)}</p>`; return; }

  let S = PG.normalize(raw);
  const orig = JSON.stringify(S), dirty = () => JSON.stringify(S) !== orig;
  const local = new Map();                 // ảnh vừa tải lên (web chưa kịp xuất bản) → xem trước bằng blob
  const open = new Set();                  // các mục đang mở (giữ nguyên khi vẽ lại)
  window.onbeforeunload = () => (dirty() ? "Có thay đổi chưa lưu" : undefined);
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
  const getp = (p) => p.split(".").reduce((o, k) => (o == null ? o : o[k]), S);
  const setp = (p, v) => { const ks = p.split("."), last = ks.pop(); ks.reduce((o, k) => o[k], S)[last] = v; };

  /* ---------- Ô nhập ---------- */
  const inp = (p, label, ph) => `<label>${label}<input data-b="${p}" value="${esc(getp(p))}" placeholder="${esc(ph || "")}"></label>`;
  const area = (p, label, rows, ph) => `<label>${label}<textarea data-b="${p}" rows="${rows}" placeholder="${esc(ph || "")}">${esc(getp(p))}</textarea></label>`;
  const chk = (p, label) => `<label class="row"><input type="checkbox" data-b="${p}" ${getp(p) !== false ? "checked" : ""}>${label}</label>`;
  const sel = (p, label, opts, redraw) => `<label>${label}<select data-b="${p}" ${redraw ? "data-redraw" : ""}>${opts.map(([v, t]) => `<option value="${v}" ${getp(p) === v ? "selected" : ""}>${t}</option>`).join("")}</select></label>`;
  const imgf = (p, label, hint) => { const u = getp(p) || "";
    return `<div class="imgf"><label>${label}<input data-b="${p}" data-img value="${esc(u)}" placeholder="/image/ten.webp hoặc https://…/anh.gif"></label>
      <div class="row"><button type="button" class="ghost" data-pick="${p}">Chọn / tải ảnh lên</button><button type="button" class="ghost" data-clr="${p}" ${u ? "" : "disabled"}>Xoá ảnh</button>${u ? `<img class="thumb" src="${esc(local.get(u) || u)}" alt="" onerror="this.style.display='none'">` : ""}</div>
      ${hint ? `<p class="hint" style="margin:4px 0 0">${hint}</p>` : ""}</div>`; };
  const tools = (arr, j, n, extra) => `<span class="tools"><button type="button" class="ghost" data-mv="${arr}|${j}|-1" ${j === 0 ? "disabled" : ""} title="Lên">↑</button><button type="button" class="ghost" data-mv="${arr}|${j}|1" ${j === n - 1 ? "disabled" : ""} title="Xuống">↓</button><button type="button" class="ghost" data-rm="${arr}|${j}" title="Xoá">✕</button>${extra || ""}</span>`;
  const rowsEd = (arr, labelPh, valuePh) => { const list = getp(arr);
    return list.map((r, j) => `<div class="kv"><input data-b="${arr}.${j}.label" value="${esc(r.label)}" placeholder="${esc(labelPh)}"><input data-b="${arr}.${j}.value" value="${esc(r.value)}" placeholder="${esc(valuePh)}">${tools(arr, j, list.length)}</div>`).join("")
      + `<button type="button" class="ghost" data-add="${arr}|row">＋ Thêm dòng</button>`; };

  /* ---------- Từng loại mục ---------- */
  const body = {
    text: (s, i) => area(`sections.${i}.body`, "Nội dung", 10, "Mỗi đoạn cách nhau một dòng trống.\n**chữ đậm**, *chữ nghiêng*, dòng chỉ có --- để kẻ ngang.") + imgf(`sections.${i}.image`, "Ảnh cuối mục (tuỳ chọn, chọn được cả GIF)"),
    info: (s, i) => `<p class="hint">Mỗi dòng gồm "nhãn: giá trị", ví dụ <b>Tuổi</b>: 18 · <b>Sinh nhật</b>: 17 tháng 11 · <b>Chiều cao</b>: 166cm · <b>Thích</b>: vẽ, game chill…</p>` + rowsEd(`sections.${i}.rows`, "Nhãn (vd: Sinh nhật)", "Giá trị")
      + `<div style="margin-top:12px">${imgf(`sections.${i}.image`, "Ảnh / GIF model hiện dưới bảng thông tin (tuỳ chọn)", "Không chọn ảnh thì phần này không hiện, không báo lỗi ảnh.")}</div>`,
    fan: (s, i) => { const a = `sections.${i}.images`, n = s.images.length;
      return area(`sections.${i}.body`, "Lời giới thiệu fan name", 4, "Các bạn có thể tự chọn fan name của mình…") + `<div class="cols">${inp(`sections.${i}.oshiLabel`, "Nhãn oshi", "Oshi mark")}${inp(`sections.${i}.oshi`, "Oshi mark (emoji hoặc chữ)", "🍀")}</div>`
        + `<div class="hint" style="margin:6px 0">Ảnh fan name (vd: hai mascot bên trái)</div>`
        + s.images.map((im, j) => `<div class="card sub">${imgf(`${a}.${j}.url`, `Ảnh ${j + 1}`)}<div class="cols">${inp(`${a}.${j}.caption`, "Chú thích dưới ảnh (vd: Furukon)")}<span style="align-self:end;margin-bottom:10px">${tools(a, j, n)}</span></div></div>`).join("")
        + `<button type="button" class="ghost" data-add="${a}|fanimg">＋ Thêm ảnh fan name</button>`; },
    models: (s, i) => { const a = `sections.${i}.items`, n = s.items.length;
      return `<p class="hint">Mỗi model là một thẻ riêng (Original, Chibi, Cheongsam…). Chỉ cần tên hoặc ảnh là thẻ sẽ hiện.</p>`
        + s.items.map((m, j) => `<details class="card sub" data-mid="${esc(m.id)}" ${open.has("m:" + m.id) ? "open" : ""}><summary><b>${esc(m.name || "Model " + (j + 1))}</b>${m.reveal ? ` <span class="hint">· ${esc(m.reveal)}</span>` : ""}</summary>
          <div class="cols">${inp(`${a}.${j}.name`, "Tên model / outfit", "Original")}${inp(`${a}.${j}.reveal`, "Ngày reveal (gõ tự do)", "16 Tháng 11, 2023")}</div>
          ${imgf(`${a}.${j}.image`, "Ảnh / GIF model", "Ảnh PNG nền trong suốt cho đẹp nhất. GIF vẫn chạy bình thường.")}
          ${area(`${a}.${j}.note`, "Ghi chú (tuỳ chọn)", 3)}
          <div class="hint" style="margin:6px 0">Thông tin thêm của model (vd: Họa sĩ, Rigger, Công cụ…)</div>${rowsEd(`${a}.${j}.info`, "Nhãn", "Giá trị")}
          <div style="margin-top:12px">${tools(a, j, n)}</div></details>`).join("")
        + `<button type="button" class="ghost" data-add="${a}|model">＋ Thêm model</button>`; },
    social: () => { const ic = window.MEDIA_ICONS || {}, ls = PG.socialLinks(channel, ic);
      return `<p class="hint">Tự lấy từ trang <a href="/admin/channel/">Kênh</a>: chỉ hiện icon các mạng xã hội đang bật, <b>không tính mục Liên hệ</b> (Discord, Telegram, Email…). Muốn thêm/bớt thì sửa ở trang Kênh.</p>`
        + (ls.length ? ls.map((l) => `<span class="chip"><span style="width:18px;height:18px;border-radius:5px;overflow:hidden;display:inline-block;background:${esc(l.bg)}">${l.svg}</span>${esc(l.label)}</span>`).join("") : `<p class="err">Chưa có mạng xã hội nào ở trang Kênh nên mục này sẽ tự ẩn.</p>`); },
  };
  const secCard = (s, i, n) => { const T = PG.TYPE_NAMES[s.type];
    return `<details class="card sec" data-sid="${esc(s.id)}" ${open.has("s:" + s.id) ? "open" : ""}><summary><b>${esc(s.nav || s.title || T)}</b><span class="hint">· ${T}${s.enabled === false ? " · đang ẩn" : ""}${PG.hasContent(s, { links: PG.socialLinks(channel, window.MEDIA_ICONS || {}) }) ? "" : " · chưa có nội dung nên chưa hiện"}</span></summary>
      <div class="row" style="justify-content:space-between;flex-wrap:wrap;margin-bottom:10px">${chk(`sections.${i}.enabled`, "Hiện mục này trên trang")}${tools("sections", i, n)}</div>
      <div class="cols">${inp(`sections.${i}.nav`, "Chữ trên nút điều hướng")}${inp(`sections.${i}.title`, "Tiêu đề mục")}</div>${body[s.type](s, i)}</details>`; };

  /* ---------- Vẽ form ---------- */
  function draw() {
    const y = window.scrollY, bg = S.background, hasSocial = S.sections.some((s) => s.type === "social");
    $("#pf_form").innerHTML = `
    <div class="card"><h3>Nền trang</h3>
      ${sel("background.mode", "Kiểu nền", [["pattern", "Hoạ tiết × mặc định (theo phong cách New Model)"], ["image", "Ảnh hoặc GIF"], ["color", "Màu trơn"]], true)}
      ${bg.mode === "image" ? imgf("background.image", "Ảnh / GIF nền", "Bấm nút để tải ảnh lên, hoặc dán URL (https://…). Link ảnh bị lỗi thì web tự dùng hoạ tiết mặc định.")
        + `<div class="cols">${sel("background.fit", "Cách đặt ảnh", [["cover", "Phủ kín (cắt phần thừa)"], ["contain", "Vừa khung (không cắt)"], ["tile", "Lặp lại như gạch lát"]])}<label class="row" style="align-self:end;margin-bottom:12px"><input type="checkbox" data-b="background.fixed" ${bg.fixed ? "checked" : ""}>Đứng yên khi cuộn trang</label></div>` : ""}
      ${bg.mode === "color" ? `<label>Màu nền<input type="color" data-b="background.color" value="${esc(bg.color)}" style="height:38px;padding:2px"></label>` : ""}
      <label>Làm tối nền: <b id="dimv">${bg.dim}</b>% (giúp chữ dễ đọc nếu ảnh nền sáng)<input type="range" min="0" max="70" step="5" data-b="background.dim" data-live="dimv" value="${bg.dim}"></label></div>
    <div class="card"><h3>Màu sắc</h3><div class="colors">
      <label>Màu chính (nền hoạ tiết, viền phụ)<input type="color" data-b="theme.primary" value="${esc(S.theme.primary)}" style="height:38px;padding:2px"></label>
      <label>Màu nhấn (nút, gạch chân)<input type="color" data-b="theme.accent" value="${esc(S.theme.accent)}" style="height:38px;padding:2px"></label>
      <label>Màu viền &amp; chữ<input type="color" data-b="theme.ink" value="${esc(S.theme.ink)}" style="height:38px;padding:2px"></label></div>
      <button type="button" class="ghost" id="resetTheme">Về màu gốc (xanh da trời – vàng – đen)</button></div>
    <div class="card"><h3>Đầu trang</h3>
      ${imgf("hero.avatar", "Ảnh đại diện (hình tròn ở đầu trang)", "Để trống thì không hiện vòng tròn avatar.")}
      <div class="cols">${inp("hero.name", "Tên Vtuber")}${inp("hero.tagline", "Dòng ngắn dưới tên", "Vtuber / PNGtuber Việt Nam")}</div>
      ${area("hero.intro", "Lời chào / giới thiệu ngắn", 4, "Xin chào, mình là **Tên**…")}</div>
    <h3 style="margin:18px 0 8px">Các mục (kéo thứ tự bằng ↑ ↓)</h3>
    ${S.sections.map((s, i) => secCard(s, i, S.sections.length)).join("") || '<p class="hint">Chưa có mục nào.</p>'}
    <div class="card"><div class="row" style="flex-wrap:wrap"><select id="addType" style="width:auto">${PG.TYPES.filter((t) => !(t === "social" && hasSocial)).map((t) => `<option value="${t}">${PG.TYPE_NAMES[t]}</option>`).join("")}</select><button type="button" class="ghost" id="addSec">＋ Thêm mục</button></div>
      <p class="hint" style="margin-bottom:0">Dùng "Văn bản" để thêm mục tuỳ ý (Commission, Lịch stream, Quy định…).</p></div>
    <div class="card"><h3>SEO</h3><p class="hint" style="margin:0">Tiêu đề, mô tả và từ khoá của trang /profile chỉnh ở <a href="/admin/setting/">Cài đặt</a> → "SEO từng trang &amp; favicon" → <b>Hồ sơ Vtuber</b>. Nội dung hồ sơ này được dựng sẵn vào HTML, JSON-LD, sitemap.xml và llms.txt sau khi lưu (khoảng 1–5 phút).</p></div>`;
    window.scrollTo(0, y);
    bar();
  }
  function bar() { const d = dirty(); $("#k_state").textContent = d ? "Có thay đổi chưa lưu." : "Không có thay đổi."; $("#k_save").disabled = !d; $("#k_undo").disabled = !d; }

  main.innerHTML = `<h2>Hồ sơ Vtuber</h2>
    <p><a class="btn ghost" href="/profile/" target="_blank">Mở /profile</a> <button type="button" class="ghost" data-json="${PATH}">Sửa file ${PATH}</button></p>
    <details class="card" id="pvbox"><summary><b>👁 Xem trước trực tiếp</b> <span class="hint">· thay đổi hiện ngay, chưa cần lưu</span></summary><iframe class="pvf" id="pf_frame" title="Xem trước trang hồ sơ"></iframe></details>
    <div id="pf_form"></div>
    <div class="bar" style="position:sticky;bottom:8px;z-index:3"><span id="k_state"></span> <button id="k_save">Lưu lên GitHub</button> <button class="ghost" id="k_undo">Hoàn tác</button></div>`;
  Admin.bindJson(main, { [PATH]: "Cấu trúc: theme, background, hero, sections[] (type: text | info | fan | models | social)." });

  /* ---------- Xem trước ---------- */
  let ready = false, pvT;
  const preview = () => { clearTimeout(pvT); pvT = setTimeout(() => { const f = $("#pf_frame"); if (ready && f && f.contentWindow) f.contentWindow.postMessage({ type: "pf-preview", data: PG.normalize(S) }, location.origin); }, 250); };
  window.addEventListener("message", (e) => { if (e.origin === location.origin && e.data && e.data.type === "pf-ready") { ready = true; preview(); } });
  $("#pvbox").addEventListener("toggle", () => { const f = $("#pf_frame"); if ($("#pvbox").open && !f.getAttribute("src")) f.src = "/profile/?preview=1"; });

  /* ---------- Sự kiện ---------- */
  const factory = { row: () => ({ label: "", value: "" }), fanimg: () => ({ url: "", caption: "" }), model: () => { const id = "m" + uid(); open.add("m:" + id); return { id, name: "", reveal: "", image: "", note: "", info: [] }; } };
  const refreshImg = (el) => { const box = el.closest(".imgf"), u = el.value.trim(); if (!box) return;
    const c = box.querySelector("[data-clr]"); if (c) c.disabled = !u;
    let t = box.querySelector(".thumb"); if (!u) { if (t) t.remove(); return; }
    if (!t) { t = document.createElement("img"); t.className = "thumb"; t.alt = ""; box.querySelector(".row").appendChild(t); }
    t.style.display = ""; t.onerror = () => (t.style.display = "none"); t.src = local.get(u) || u; };
  const onEdit = (e) => { const el = e.target.closest("[data-b]"); if (!el) return;
    if (el.hasAttribute("data-redraw") && e.type !== "change") return;
    const v = el.type === "checkbox" ? el.checked : el.type === "range" ? Number(el.value) : el.value;
    setp(el.dataset.b, v);
    if (el.dataset.live) { const o = document.getElementById(el.dataset.live); if (o) o.textContent = v; }
    if (el.hasAttribute("data-img")) refreshImg(el);
    if (el.hasAttribute("data-redraw")) draw(); else bar();
    preview(); };
  main.addEventListener("input", onEdit); main.addEventListener("change", onEdit);
  main.addEventListener("toggle", (e) => { const d = e.target; if (!(d instanceof HTMLDetailsElement)) return; const k = d.dataset.sid ? "s:" + d.dataset.sid : d.dataset.mid ? "m:" + d.dataset.mid : ""; if (k) (d.open ? open.add(k) : open.delete(k)); }, true);
  main.addEventListener("click", (e) => { const b = e.target.closest("button"); if (!b) return;
    if (b.dataset.pick) { ImgPick.open({ Admin, onPick: (url, pv) => { local.set(url, pv); setp(b.dataset.pick, url); draw(); preview(); } }); return; }
    if (b.dataset.clr) { setp(b.dataset.clr, ""); draw(); preview(); return; }
    if (b.dataset.add) { const [arr, kind] = b.dataset.add.split("|"); getp(arr).push(factory[kind]()); draw(); preview(); return; }
    if (b.dataset.rm) { const [arr, j] = b.dataset.rm.split("|"), list = getp(arr); if (arr === "sections" || arr.endsWith(".items")) { if (!confirm("Xoá mục này?")) return; } list.splice(+j, 1); draw(); preview(); return; }
    if (b.dataset.mv) { const [arr, j, d] = b.dataset.mv.split("|"), list = getp(arr), a = +j, c = a + +d; if (c < 0 || c >= list.length) return; [list[a], list[c]] = [list[c], list[a]]; draw(); preview(); return; }
    if (b.id === "resetTheme") { S.theme = { ...PG.THEME }; draw(); preview(); return; }
    if (b.id === "addSec") { const t = $("#addType").value, d = PG.defaults().sections.find((x) => x.type === t) || { type: t, nav: "", title: "" };
      const s = { ...JSON.parse(JSON.stringify(d)), id: t + "-" + uid().slice(-4), enabled: true }; if (t === "text") { s.nav = "Mục mới"; s.title = "Mục mới"; s.body = ""; s.image = ""; } else if (t === "info") s.rows = [];
      S.sections.push(s); open.add("s:" + s.id); draw(); preview(); } });
  $("#k_undo").onclick = () => { if (confirm("Bỏ hết thay đổi chưa lưu?")) { window.onbeforeunload = null; location.reload(); } };
  $("#k_save").onclick = async () => {
    const out = PG.normalize(S), bad = PG.imageFields(out).find(([, u]) => u && !PG.safeImg(u));
    if (bad) return Admin.toast(`${bad[0]}: link ảnh phải bắt đầu bằng / hoặc https://`, true);
    const b = $("#k_save"); b.disabled = true;
    try { await Admin.commitFiles("Admin: cập nhật trang hồ sơ Vtuber", [{ path: PATH, content: JSON.stringify(out, null, 2) + "\n" }]); window.onbeforeunload = null; Admin.toast("Đã lưu. Web cập nhật sau ~1 phút."); setTimeout(() => location.reload(), 1400); }
    catch (e) { Admin.toast(e.message, true); b.disabled = false; }
  };
  draw();
}});
</script></body></html>
