<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Kênh</title>
<link rel="stylesheet" href="/admin/css/admin.css">
<style>.ic{display:inline-block;width:26px;height:26px;border-radius:7px;overflow:hidden;vertical-align:middle;margin-right:8px}.ic svg{width:100%;height:100%;display:block}
.lk{background:#0a1626}.grp{font-size:12px;color:var(--mute);margin:14px 0 4px}</style></head>
<body><div id="app"></div><div id="toast"></div>
<script src="/js/icons.js"></script>
<script src="/admin/js/core.js"></script>
<script>
Admin.boot({ id: "channel", title: "Kênh", async render(main) {
  const { esc, $ } = Admin, PATH = "channel/data.json", ICONS = window.MEDIA_ICONS || {};
  main.innerHTML = `<h2>Kênh</h2><p class="hint">Đang tải…</p>`;
  let data;
  try { data = await Admin.readJson(PATH, { links: [] }); } catch (e) { main.innerHTML = `<h2>Kênh</h2><p class="err">${esc(e.message)}</p>`; return; }
  const NAMES = { youtube: "YouTube", facebook: "Facebook", tiktok: "TikTok", x: "X (Twitter)", threads: "Threads", instagram: "Instagram", twitch: "Twitch", telegram: "Telegram", discord: "Discord", messenger: "Messenger", email: "Email" };
  const keys = [...Object.keys(NAMES).filter((k) => ICONS[k]), ...Object.keys(ICONS).filter((k) => !NAMES[k] && k !== "ticket")];
  let links = (data.links || []).map((l) => ({ ...l, icon: l.icon || l.id, group: l.group === "contact" ? "contact" : "social", visible: l.visible !== false }));
  const orig = JSON.stringify(links);
  const dirty = () => JSON.stringify(links) !== orig;
  window.onbeforeunload = () => (dirty() ? "Có thay đổi chưa lưu" : undefined);
  const chip = (k) => `<span class="ic" style="background:${ICONS[k] ? ICONS[k].bg : "#333"}">${ICONS[k] ? ICONS[k].svg : ""}</span>`;
  function draw() {
    const section = (g, title) => { const idx = links.map((l, i) => [l, i]).filter(([l]) => l.group === g);
      return `<div class="grp">${title} (${idx.length})</div>` + (idx.map(([l, i]) => `<div class="card lk"><div class="cols">
        <label>Nền tảng / icon<select data-f="${i}:icon">${keys.map((k) => `<option value="${k}" ${l.icon === k ? "selected" : ""}>${esc(NAMES[k] || k)}</option>`).join("")}</select></label>
        <label>Chữ trên nút<input data-f="${i}:label" value="${esc(l.label)}"></label></div>
        <label>${l.icon === "email" ? "Địa chỉ email (hoặc mailto:…)" : "Link (https://…)"}<input data-f="${i}:url" value="${esc(l.url)}" placeholder="${l.icon === "email" ? "ban@gmail.com" : "https://…"}"></label>
        <div class="row" style="justify-content:space-between;flex-wrap:wrap">${chip(l.icon)}<label class="row" style="margin:0"><input type="checkbox" data-v="${i}" ${l.visible ? "checked" : ""}>Hiện trên trang</label>
        <span style="white-space:nowrap"><label class="row" style="display:inline-flex;margin:0 8px 0 0">Mục: <select data-g="${i}" style="width:auto;margin-left:6px"><option value="social" ${l.group === "social" ? "selected" : ""}>Mạng xã hội</option><option value="contact" ${l.group === "contact" ? "selected" : ""}>Liên hệ</option></select></label>
        <button type="button" class="ghost" data-mv="${i}:-1">↑</button> <button type="button" class="ghost" data-mv="${i}:1">↓</button> <button type="button" class="ghost" data-rm="${i}">✕</button></span></div></div>`).join("") || '<p class="hint">Chưa có.</p>');
    };
    main.innerHTML = `<h2>Kênh</h2>
      <p><button type="button" class="ghost" data-json="channel/data.json">Sửa file channel/data.json</button></p>
      ${section("social", "Mạng xã hội")}${section("contact", "Liên hệ (Discord, Messenger, Email…)")}
      <p><button type="button" class="ghost" id="add_s">＋ Thêm mạng xã hội</button> <button type="button" class="ghost" id="add_c">＋ Thêm liên hệ</button></p>
      <div class="bar" style="position:sticky;bottom:8px">${dirty() ? "Có thay đổi chưa lưu." : "Không có thay đổi."} <button id="k_save" ${dirty() ? "" : "disabled"}>Lưu lên GitHub</button> <button class="ghost" id="k_undo" ${dirty() ? "" : "disabled"}>Hoàn tác</button></div>`;
    Admin.bindJson(main, { "channel/data.json": "Mỗi link: id, icon, label, url, group (contact = mục Liên hệ), visible (false = ẩn)." });
    main.querySelectorAll("[data-f]").forEach((el) => { const [i, k] = el.dataset.f.split(":"); el.oninput = () => { links[+i][k] = el.value; if (k === "icon") draw(); else { /* không vẽ lại khi gõ */ $("#k_save").disabled = !dirty(); $("#k_undo").disabled = !dirty(); } }; });
    main.querySelectorAll("[data-v]").forEach((el) => (el.onchange = () => { links[+el.dataset.v].visible = el.checked; draw(); }));
    main.querySelectorAll("[data-g]").forEach((el) => (el.onchange = () => { links[+el.dataset.g].group = el.value; draw(); }));
    main.querySelectorAll("[data-mv]").forEach((el) => (el.onclick = () => { const [i, d] = el.dataset.mv.split(":").map(Number), j = i + d; if (j < 0 || j >= links.length) return; [links[i], links[j]] = [links[j], links[i]]; draw(); }));
    main.querySelectorAll("[data-rm]").forEach((el) => (el.onclick = () => { if (confirm("Xóa link này?")) { links.splice(+el.dataset.rm, 1); draw(); } }));
    const add = (group, icon) => () => { const n = links.filter((l) => l.icon === icon).length + 1; links.push({ id: icon + "-" + Date.now().toString(36), icon, group, label: NAMES[icon] || icon, url: "", visible: true }); draw(); };
    $("#add_s").onclick = add("social", "youtube"); $("#add_c").onclick = add("contact", "discord");
    $("#k_undo").onclick = () => { if (confirm("Bỏ hết thay đổi chưa lưu?")) location.reload(); };
    $("#k_save").onclick = async () => {
      for (const [i, l] of links.entries()) {
        const u = String(l.url || "").trim();
        if (!u) return Admin.toast(`Link ${i + 1} (${NAMES[l.icon] || l.icon}): chưa nhập địa chỉ`, true);
        const ok = l.icon === "email" ? /^(mailto:)?[^\s@]+@[^\s@]+\.[^\s@]+$/i.test(u) : /^https?:\/\//i.test(u);
        if (!ok) return Admin.toast(`Link ${i + 1} (${NAMES[l.icon] || l.icon}): ${l.icon === "email" ? "email chưa đúng dạng ten@mien.com" : "phải bắt đầu bằng http:// hoặc https://"}`, true);
      }
      const out = links.map((l) => ({ id: l.id, icon: l.icon, label: String(l.label || "").trim() || NAMES[l.icon] || l.icon, url: l.url.trim().replace(/^mailto:/i, l.icon === "email" ? "" : "mailto:"),
        ...(l.group === "contact" ? { group: "contact" } : {}), ...(l.visible ? {} : { visible: false }) }));
      const b = $("#k_save"); b.disabled = true;
      try { await Admin.commitFiles("Admin: cập nhật trang kênh", [{ path: PATH, content: JSON.stringify({ ...data, links: out }, null, 2) + "\n" }]); window.onbeforeunload = null; Admin.toast("Đã lưu. Web cập nhật sau ~1 phút."); setTimeout(() => location.reload(), 1400); }
      catch (e) { Admin.toast(e.message, true); b.disabled = false; }
    };
  }
  draw();
}});
</script></body></html>
