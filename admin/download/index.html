<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Download</title>
<link rel="stylesheet" href="/admin/css/admin.css"></head>
<body><div id="app"></div><div id="toast"></div>
<script src="/admin/js/core.js"></script>
<script src="/admin/js/seo.js"></script>
<script src="/admin/js/postgen.js"></script>
<script src="/admin/js/rebuild.js"></script>
<script>
Admin.boot({ id: "download", title: "Download", async render(main) {
  const { esc, $ } = Admin;
  main.innerHTML = `<h2>Download</h2><p class="hint">Đang tải…</p>`;
  let S, tree, pool, items = [];
  const REPO_API = "https://api.github.com/repos/ShinjuVN/shinjuvn.github.io";
  async function firstCommitDate(path) {
    const key = "shinju_dl_created:" + path;
    try { const c = localStorage.getItem(key); if (c) return c; } catch (e) { /* bỏ qua */ }
    try {
      let r = await fetch(`${REPO_API}/commits?path=${encodeURIComponent(path)}&per_page=1`);
      if (!r.ok) return null;
      let arr = await r.json();
      const last = (r.headers.get("Link") || "").match(/<([^>]+)>;\s*rel="last"/); // trang cuối = commit cũ nhất
      if (last) { r = await fetch(last[1]); if (!r.ok) return null; arr = await r.json(); }
      const date = arr.length && arr[arr.length - 1].commit && arr[arr.length - 1].commit.committer.date;
      if (date) { try { localStorage.setItem(key, date); } catch (e) { /* bỏ qua */ } }
      return date || null;
    } catch (e) { return null; }
  }
  const load = async () => {
    [S, tree, pool] = await Promise.all([Admin.readJson("site-settings.json", {}), Admin.api("/tree").then((r) => r.files.map((f) => f.path)), Admin.readJson("download/ads-data.json", { adLinks: [] })]);
    const ids = tree.map((p) => (p.match(/^download\/data\/([^/]+)\.json$/) || [])[1]).filter(Boolean);
    items = await Promise.all(ids.map(async (id) => ({ id, d: await Admin.readJson(`download/data/${id}.json`) })));
    // Thứ tự danh sách: ngày tạo mới nhất lên đầu. Mục mới lưu sẵn createdAt; mục cũ chưa có thì
    // lấy ngày commit đầu tiên của file trên GitHub (lưu cache ở trình duyệt, lỗi thì xếp cuối).
    await Promise.all(items.map(async (it) => { it.ts = Date.parse(it.d.createdAt || "") || Date.parse((await firstCommitDate(`download/data/${it.id}.json`)) || "") || 0; }));
    items.sort((a, b) => b.ts - a.ts || a.id.localeCompare(b.id));
  };
  try { await load(); } catch (e) { main.innerHTML = `<h2>Download</h2><p class="err">${esc(e.message)}</p>`; return; }
  const seo = AdminSeo.merge(S.seo), site = seo.siteUrl.replace(/\/$/, "");
  const cats = [...new Set([...(pool.adLinks || []).map((l) => l.category).filter(Boolean), "Youtube", "Social Media", "Image"])];
  const DEF_HINT = "Xem quảng cáo bên dưới để ủng hộ mình, sau đó bấm Tải Xuống nhé!";

  /* ---------------- Danh sách ---------------- */
  function showList() {
    const rows = items.map(({ id, d, ts }) => `<tr style="border-top:1px solid var(--line)"><td style="padding:8px 0">${esc(d.title || id)}<br><small class="hint">${esc(id)}${ts ? " · " + new Date(ts).toLocaleDateString("vi-VN") : ""} · ${(d.downloads || []).length} nút tải · ${(d.adButtons || []).length} nút quảng cáo</small></td>
      <td style="text-align:right;white-space:nowrap"><a href="/download/${encodeURIComponent(id)}/" target="_blank">Mở</a>${d.short ? ` · <a href="#" data-copy="${site}/s/${esc(d.short)}/">Chép link</a>` : ""} · <a href="#edit/${encodeURIComponent(id)}">Sửa</a> · <a href="#" data-del="${esc(id)}" style="color:#ff8b8f">Xóa</a></td></tr>`).join("");
    main.innerHTML = `<h2>Download</h2><p><a class="btn" href="#new">＋ Mục tải mới</a></p>
      <div class="card"><div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse">${rows || '<tr><td class="hint">Chưa có mục tải nào.</td></tr>'}</table></div></div>`;
    main.querySelectorAll("[data-copy]").forEach((el) => (el.onclick = (e) => { e.preventDefault(); navigator.clipboard.writeText(el.dataset.copy).then(() => Admin.toast("Đã chép: " + el.dataset.copy)); }));
    main.querySelectorAll("[data-del]").forEach((el) => (el.onclick = async (e) => {
      e.preventDefault(); const it = items.find((x) => x.id === el.dataset.del); if (!confirm(`Xóa mục tải “${it.d.title || it.id}”? Trang và link rút gọn sẽ bị xóa.`)) return;
      try { await Rebuild.deleteDownload(Admin, { id: it.id, data: it.d, seo, message: "Admin: xóa mục tải " + it.id }); Admin.toast("Đã xóa. Web cập nhật sau ~1 phút."); setTimeout(() => location.reload(), 1200); }
      catch (err) { Admin.toast(err.message, true); }
    }));
  }

  /* ---------------- Trình soạn ---------------- */
  function showEditor(editId) {
    const old = editId ? items.find((x) => x.id === editId)?.d : null;
    if (editId && !old) { location.hash = ""; return; }
    const d = old || {};
    let ads = (d.adButtons || []).map((b) => ({ ...b, type: b.type === "custom" ? "custom" : "ads", categories: b.categories || [] }));
    let dls = (d.downloads || (d.download ? [d.download] : [])).map((x) => ({ ...x }));
    if (!editId) { ads = [{ id: "ad1", label: "Xem quảng cáo 10s để ủng hộ mình", seconds: 10, type: "ads", categories: ["Youtube"] }]; dls = [{ id: "primary", label: "Tải Xuống", url: "" }]; }
    const hintMode = typeof d.hint === "string" ? (d.hint === "" ? "hide" : "custom") : "default";
    main.innerHTML = `<h2>${editId ? "Sửa mục tải" : "Mục tải mới"} <a href="#" style="font-size:14px;margin-left:8px">← Danh sách</a></h2>
    <div class="card">
      <label>Tiêu đề trang<input id="d_title" value="${esc(d.title || "")}"></label>
      <label>ID / đường dẫn (${esc(site)}/download/…)<input id="d_id" ${editId ? "readonly" : ""} value="${esc(editId || "")}" placeholder="để trống: tự tạo từ tiêu đề + 9 số"></label>
      <label>Mô tả (hiện trên Google)<textarea id="d_desc" rows="2">${esc(d.description || "")}</textarea></label>
      <label>Từ khóa (cách nhau bằng dấu phẩy)<input id="d_kw" value="${esc(d.keywords || "")}"></label>
      <button type="button" class="ghost" id="d_ai">✨ AI gợi ý mô tả và từ khóa</button>
    </div>
    <div class="card"><label class="row"><input type="checkbox" id="d_cm" ${d.comments === false ? "" : "checked"}>Cho phép bình luận (Giscus) ở trang này</label></div>
    <div class="card"><h3>Câu hướng dẫn trên trang</h3>
      <label><select id="d_hm"><option value="default" ${hintMode === "default" ? "selected" : ""}>Dùng câu mặc định</option><option value="custom" ${hintMode === "custom" ? "selected" : ""}>Tự viết câu riêng</option><option value="hide" ${hintMode === "hide" ? "selected" : ""}>Ẩn câu hướng dẫn</option></select></label>
      <label id="d_hl">Nội dung câu<input id="d_hint" placeholder="${esc(DEF_HINT)}" value="${esc(hintMode === "custom" ? d.hint : "")}"></label></div>
    <div class="card"><h3>Nút quảng cáo</h3><label class="row"><input type="checkbox" id="d_req" ${d.requireAllAds === false ? "" : "checked"}>Bắt buộc xem hết các nút quảng cáo mới được tải <small class="hint">(bỏ tick: ai cũng tải được ngay, nút quảng cáo chỉ để ủng hộ nếu muốn)</small></label><div id="adl"></div><button type="button" class="ghost" id="ad_add">＋ Thêm nút quảng cáo</button></div>
    <div class="card"><h3>Nút tải xuống</h3><div id="dll"></div><button type="button" class="ghost" id="dl_add">＋ Thêm nút tải</button></div>
    <button id="d_save">${editId ? "Lưu thay đổi" : "Đăng mục tải"}</button> <span class="hint" id="d_st"></span>`;
    $("#d_hm").onchange = () => ($("#d_hl").style.display = $("#d_hm").value === "custom" ? "" : "none"); $("#d_hm").onchange();
    const move = (arr, i, k) => { const j = i + k; if (j < 0 || j >= arr.length) return; [arr[i], arr[j]] = [arr[j], arr[i]]; };
    const ctl = (kind, i, n) => `<span style="white-space:nowrap"><button type="button" class="ghost" data-mv="${kind}:${i}:-1" ${i === 0 ? "disabled" : ""}>↑</button> <button type="button" class="ghost" data-mv="${kind}:${i}:1" ${i === n - 1 ? "disabled" : ""}>↓</button> <button type="button" class="ghost" data-rm="${kind}:${i}">✕</button></span>`;
    function draw() {
      $("#adl").innerHTML = ads.map((b, i) => `<div class="card" style="background:#0a1626"><div class="cols">
        <label>Chữ trên nút<input data-f="ads:${i}:label" value="${esc(b.label)}"></label>
        <label>Số giây phải xem<input type="number" min="1" max="300" data-f="ads:${i}:seconds" value="${esc(b.seconds)}"></label></div>
        <label>Loại<select data-f="ads:${i}:type"><option value="ads" ${b.type === "ads" ? "selected" : ""}>Quảng cáo theo nhóm (chọn ngẫu nhiên trong kho)</option><option value="custom" ${b.type === "custom" ? "selected" : ""}>Link tự chọn (vd: video bạn muốn cho xem)</option></select></label>
        ${b.type === "custom" ? `<label>Link cần mở<input data-f="ads:${i}:url" placeholder="https://…" value="${esc(b.url || "")}"></label>`
          : `<div class="hint">Nhóm quảng cáo:</div><div style="display:flex;flex-wrap:wrap;gap:12px;margin:6px 0">${cats.map((c) => `<label class="row" style="margin:0"><input type="checkbox" data-cat="${i}" value="${esc(c)}" ${b.categories.map((x) => x.toLowerCase()).includes(c.toLowerCase()) ? "checked" : ""}>${esc(c)}</label>`).join("")}</div>`}
        <div style="text-align:right">${ctl("ads", i, ads.length)}</div></div>`).join("") || '<p class="hint">Chưa có nút quảng cáo (người dùng tải ngay).</p>';
      $("#dll").innerHTML = dls.map((x, i) => `<div class="card" style="background:#0a1626"><div class="cols">
        <label>Chữ trên nút<input data-f="dls:${i}:label" value="${esc(x.label)}"></label>
        <label>Link tải<input data-f="dls:${i}:url" placeholder="https://…" value="${esc(x.url)}"></label></div>
        <div style="text-align:right">${ctl("dls", i, dls.length)}</div></div>`).join("");
    }
    const arr = (k) => (k === "ads" ? ads : dls);
    main.addEventListener("input", (e) => { const f = e.target.dataset.f; if (!f) return; const [k, i, p] = f.split(":"); const v = e.target.value; arr(k)[+i][p] = p === "seconds" ? +v : v; });
    main.addEventListener("change", (e) => { const t = e.target;
      if (t.dataset.f && t.dataset.f.endsWith(":type")) { ads[+t.dataset.f.split(":")[1]].type = t.value; draw(); }
      if (t.dataset.cat !== undefined) { const b = ads[+t.dataset.cat]; b.categories = [...main.querySelectorAll(`[data-cat="${t.dataset.cat}"]:checked`)].map((c) => c.value); } });
    main.addEventListener("click", (e) => { const t = e.target;
      if (t.dataset.mv) { const [k, i, s] = t.dataset.mv.split(":"); move(arr(k), +i, +s); draw(); }
      if (t.dataset.rm) { const [k, i] = t.dataset.rm.split(":"); arr(k).splice(+i, 1); draw(); } });
    $("#ad_add").onclick = () => { const n = Math.max(0, ...ads.map((b) => parseInt(String(b.id).replace(/\D/g, "")) || 0)) + 1; ads.push({ id: "ad" + n, label: "Xem quảng cáo để ủng hộ mình", seconds: 10, type: "ads", categories: [] }); draw(); };
    $("#dl_add").onclick = () => { dls.push({ id: "dl" + (dls.length + 1), label: `Link dự phòng ${dls.length}`, url: "" }); draw(); };
    $("#d_ai").onclick = async () => { const b = $("#d_ai"); b.disabled = true;
      try { const r = await Admin.api("/ai/seo", { title: $("#d_title").value, body: `Trang tải xuống. ${$("#d_desc").value} ${$("#d_kw").value}` }); if (r.description) $("#d_desc").value = r.description; if (r.keywords) $("#d_kw").value = [].concat(r.keywords).join(", "); Admin.toast("AI đã điền gợi ý, xem lại rồi đăng."); }
      catch (err) { Admin.toast(err.message, true); } b.disabled = false; };
    $("#d_save").onclick = async () => {
      const v = (i) => $("#" + i).value.trim(), title = v("d_title"), isUrl = (u) => /^https?:\/\//i.test(String(u || "").trim());
      if (!title) return Admin.toast("Cần nhập tiêu đề", true);
      if (!dls.length || dls.some((x) => !isUrl(x.url))) return Admin.toast("Mỗi nút tải cần một link http(s)://", true);
      for (const [i, b] of ads.entries()) {
        if (!(b.seconds >= 1 && b.seconds <= 300)) return Admin.toast(`Nút quảng cáo ${i + 1}: số giây phải từ 1 đến 300`, true);
        if (b.type === "custom" ? !isUrl(b.url) : !b.categories.length) return Admin.toast(`Nút quảng cáo ${i + 1}: ${b.type === "custom" ? "cần link http(s)://" : "hãy chọn ít nhất một nhóm"}`, true);
      }
      let id = editId; const used = new Set(tree.map((p) => (p.match(/^download\/data\/([^/]+)\.json$/) || [])[1]).filter(Boolean));
      if (!id) { const c = v("d_id") && PostGen.slugify(v("d_id")); if (c) { if (used.has(c)) return Admin.toast("ID này đã có mục tải dùng", true); id = c; } else id = PostGen.newPostId(title, used); }
      const data = { ...d, title: title.replace(/\s+/g, " ") };
      if (!data.createdAt) { const old = editId && items.find((x) => x.id === editId); data.createdAt = new Date(old && old.ts ? old.ts : Date.now()).toISOString(); } // ngày tạo (mục cũ giữ ngày commit đầu), dùng để sắp xếp danh sách
      const put = (k, val) => (val ? (data[k] = val) : delete data[k]);
      put("description", v("d_desc")); put("keywords", v("d_kw"));
      const hm = $("#d_hm").value; if (hm === "hide") data.hint = ""; else if (hm === "custom" && v("d_hint")) data.hint = v("d_hint"); else delete data.hint;
      if ($("#d_cm").checked) delete data.comments; else data.comments = false;
      if ($("#d_req").checked) delete data.requireAllAds; else data.requireAllAds = false;
      data.adButtons = ads.map((b) => ({ id: b.id, label: b.label.trim() || "Xem quảng cáo", seconds: b.seconds, ...(b.type === "custom" ? { type: "custom", url: b.url.trim() } : { categories: b.categories }) }));
      data.downloads = dls.map((x, i) => ({ ...x, id: x.id || "dl" + (i + 1), label: (x.label || "").trim() || (i === 0 ? "Tải Xuống" : `Link dự phòng ${i}`), url: x.url.trim() }));
      delete data.download;
      const b = $("#d_save"); b.disabled = true; $("#d_st").textContent = "Đang đăng…";
      try { await Rebuild.saveDownload(Admin, { id, data, seo, message: `Admin: ${editId ? "sửa" : "đăng"} mục tải ${id}` });
        Admin.toast(`Đã ${editId ? "lưu" : "đăng"}: ${site}/download/${id}/ (hoạt động sau ~1 phút)`); setTimeout(() => { location.hash = ""; location.reload(); }, 1800);
      } catch (err) { $("#d_st").textContent = ""; Admin.toast(err.message, true); b.disabled = false; }
    };
    draw();
  }
  const show = () => { const h = location.hash; if (h === "#new") showEditor(null); else if (h.startsWith("#edit/")) showEditor(decodeURIComponent(h.slice(6))); else showList(); };
  addEventListener("hashchange", () => location.reload()); show();
}});
</script></body></html>
