<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Donate</title>
<link rel="stylesheet" href="/admin/css/admin.css">
<style>.m{border-left:3px solid var(--blue)}.btn2{background:#0a1626}.qrp{max-width:140px;max-height:140px;border-radius:8px;background:#fff;display:block;margin:6px 0}</style></head>
<body><div id="app"></div><div id="toast"></div>
<script src="/admin/js/core.js"></script>
<script src="/admin/js/postgen.js"></script>
<script>
Admin.boot({ id: "donate", title: "Donate", async render(main) {
  const { esc, $ } = Admin, PATH = "donate/data.json";
  main.innerHTML = `<h2>Donate</h2><p class="hint">Đang tải…</p>`;
  let data, tree;
  try { [data, tree] = await Promise.all([Admin.readJson(PATH, { title: "Ủng Hộ", methods: [] }), Admin.api("/tree").then((r) => r.files.map((f) => f.path))]); }
  catch (e) { main.innerHTML = `<h2>Donate</h2><p class="err">${esc(e.message)}</p>`; return; }
  // Mỗi nhóm (method) có nhiều nút; mỗi nút là url hoặc ảnh QR. _file: ảnh QR mới chọn, chờ lưu.
  const norm = (b) => ({ ...b, type: b.type === "qr" ? "qr" : "link", visible: b.visible !== false });
  let title = data.title || "", methods = (data.methods || []).map((m) => ({ ...m, visible: m.visible !== false, buttons: (m.buttons || []).map(norm) }));
  const snap = () => JSON.stringify({ title, methods: methods.map((m) => ({ ...m, buttons: m.buttons.map((b) => ({ ...b, _file: b._file ? 1 : 0 })) })) });
  const orig = snap(), dirty = () => snap() !== orig;
  window.onbeforeunload = () => (dirty() ? "Có thay đổi chưa lưu" : undefined);
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
  function draw() {
    main.innerHTML = `<h2>Donate</h2>
    <p><button type="button" class="ghost" data-json="donate/data.json">Sửa file donate/data.json</button></p>
    <div class="card"><label>Tiêu đề trang<input id="dn_title" value="${esc(title)}"></label></div>
    ${methods.map((m, mi) => `<div class="card m"><div class="cols"><label>Tên nhóm (vd: Internet Banking VN)<input data-m="${mi}:label" value="${esc(m.label)}"></label>
      <label class="row" style="align-self:end"><input type="checkbox" data-mv="${mi}" ${m.visible ? "checked" : ""}>Hiện cả nhóm</label></div>
      ${m.buttons.map((b, bi) => `<div class="card btn2"><div class="cols"><label>Chữ trên nút (vd: Vietcombank)<input data-b="${mi}:${bi}:label" value="${esc(b.label || "")}" placeholder="Donate"></label>
        <label>Loại<select data-b="${mi}:${bi}:type"><option value="link" ${b.type === "link" ? "selected" : ""}>Link (URL)</option><option value="qr" ${b.type === "qr" ? "selected" : ""}>Mã QR (ảnh)</option></select></label></div>
        ${b.type === "link" ? `<label>URL<input data-b="${mi}:${bi}:url" value="${esc(b.url || "")}" placeholder="https://…"></label>`
          : `<label>Ảnh QR (giữ nguyên chất lượng, tối đa ~1,5 MB)<input type="file" accept="image/*" data-q="${mi}:${bi}"></label>${b._file || b.qr ? `<img class="qrp" src="${esc(b._file ? b._file.url : b.qr)}" alt="QR">` : '<p class="hint">Chưa có ảnh QR.</p>'}`}
        <div class="row" style="justify-content:space-between"><label class="row" style="margin:0"><input type="checkbox" data-bv="${mi}:${bi}" ${b.visible ? "checked" : ""}>Hiện nút này</label>
          <span><button type="button" class="ghost" data-bm="${mi}:${bi}:-1">↑</button> <button type="button" class="ghost" data-bm="${mi}:${bi}:1">↓</button> <button type="button" class="ghost" data-brm="${mi}:${bi}">✕</button></span></div></div>`).join("")}
      <div class="row" style="justify-content:space-between"><button type="button" class="ghost" data-badd="${mi}">＋ Thêm nút trong nhóm</button>
        <span><button type="button" class="ghost" data-mm="${mi}:-1">↑</button> <button type="button" class="ghost" data-mm="${mi}:1">↓</button> <button type="button" class="ghost" data-mrm="${mi}" style="color:#ff8b8f">Xóa nhóm</button></span></div></div>`).join("") || '<p class="hint">Chưa có nhóm nào.</p>'}
    <p><button type="button" class="ghost" id="m_add">＋ Thêm nhóm donate</button></p>
    <div class="bar" style="position:sticky;bottom:8px">${dirty() ? "Có thay đổi chưa lưu." : "Không có thay đổi."} <button id="d_save" ${dirty() ? "" : "disabled"}>Lưu lên GitHub</button> <button class="ghost" id="d_undo" ${dirty() ? "" : "disabled"}>Hoàn tác</button></div>`;
    Admin.bindJson(main, { "donate/data.json": "Mỗi nhóm: id, label, visible, buttons[{id,label,type: link|qr, url|qr, visible}]." });
    const touch = () => { $("#d_save").disabled = !dirty(); $("#d_undo").disabled = !dirty(); };
    $("#dn_title").oninput = (e) => { title = e.target.value; touch(); };
    main.querySelectorAll("[data-m]").forEach((el) => (el.oninput = () => { const [i, k] = el.dataset.m.split(":"); methods[+i][k] = el.value; touch(); }));
    main.querySelectorAll("[data-mv]").forEach((el) => (el.onchange = () => { methods[+el.dataset.mv].visible = el.checked; touch(); }));
    main.querySelectorAll("[data-b]").forEach((el) => { const [i, j, k] = el.dataset.b.split(":"); el.oninput = () => { methods[+i].buttons[+j][k] = el.value; if (k === "type") draw(); else touch(); }; });
    main.querySelectorAll("[data-bv]").forEach((el) => (el.onchange = () => { const [i, j] = el.dataset.bv.split(":"); methods[+i].buttons[+j].visible = el.checked; touch(); }));
    main.querySelectorAll("[data-q]").forEach((el) => (el.onchange = () => { const f = el.files[0]; if (!f) return; if (f.size > 1.5e6) { el.value = ""; return Admin.toast("Ảnh QR quá nặng (tối đa ~1,5 MB)", true); }
      const [i, j] = el.dataset.q.split(":"); methods[+i].buttons[+j]._file = { file: f, url: URL.createObjectURL(f) }; draw(); }));
    const mv = (arr, i, d) => { const j = i + d; if (j >= 0 && j < arr.length) { [arr[i], arr[j]] = [arr[j], arr[i]]; draw(); } };
    main.querySelectorAll("[data-bm]").forEach((el) => (el.onclick = () => { const [i, j, d] = el.dataset.bm.split(":").map(Number); mv(methods[i].buttons, j, d); }));
    main.querySelectorAll("[data-mm]").forEach((el) => (el.onclick = () => { const [i, d] = el.dataset.mm.split(":").map(Number); mv(methods, i, d); }));
    main.querySelectorAll("[data-brm]").forEach((el) => (el.onclick = () => { const [i, j] = el.dataset.brm.split(":").map(Number); if (confirm("Xóa nút này?")) { methods[i].buttons.splice(j, 1); draw(); } }));
    main.querySelectorAll("[data-mrm]").forEach((el) => (el.onclick = () => { if (confirm("Xóa cả nhóm và các nút trong đó?")) { methods.splice(+el.dataset.mrm, 1); draw(); } }));
    main.querySelectorAll("[data-badd]").forEach((el) => (el.onclick = () => { methods[+el.dataset.badd].buttons.push({ id: "btn-" + uid(), label: "", type: "link", url: "", visible: true }); draw(); }));
    $("#m_add").onclick = () => { methods.push({ id: "m-" + uid(), label: "Nhóm mới", visible: true, buttons: [{ id: "btn-" + uid(), label: "", type: "link", url: "", visible: true }] }); draw(); };
    $("#d_undo").onclick = () => { if (confirm("Bỏ hết thay đổi chưa lưu?")) location.reload(); };
    $("#d_save").onclick = save;
  }
  async function save() {
    const files = [], deletes = [], oldQr = new Set();
    for (const m of (data.methods || [])) for (const b of (m.buttons || [])) if (b.qr) oldQr.add(String(b.qr).replace(/^\//, ""));
    for (const [mi, m] of methods.entries()) {
      if (!String(m.label || "").trim()) return Admin.toast(`Nhóm ${mi + 1}: cần đặt tên`, true);
      if (!m.buttons.length) return Admin.toast(`Nhóm “${m.label}”: cần ít nhất một nút (hoặc xóa nhóm)`, true);
      for (const [bi, b] of m.buttons.entries()) {
        const at = `Nhóm “${m.label}”, nút ${bi + 1}`;
        if (b.type === "link" && !/^https?:\/\//i.test(String(b.url || "").trim())) return Admin.toast(`${at}: URL phải bắt đầu bằng http:// hoặc https://`, true);
        if (b.type === "qr" && !b._file && !b.qr) return Admin.toast(`${at}: chưa chọn ảnh QR`, true);
      }
    }
    const out = [];
    for (const m of methods) {
      const buttons = [];
      for (const b of m.buttons) {
        const nb = { id: b.id || "btn-" + uid(), ...(String(b.label || "").trim() ? { label: b.label.trim() } : {}), type: b.type };
        if (b.type === "link") nb.url = b.url.trim();
        else if (b._file) { // giữ nguyên byte gốc của ảnh QR (không nén lại để mã quét được)
          const ext = (b._file.file.type.split("/")[1] || "png").replace("jpeg", "jpg").replace(/[^a-z0-9]/g, "") || "png", path = `assets/donate/qr-${uid()}.${ext}`;
          const b64 = await new Promise((r) => { const fr = new FileReader(); fr.onload = () => r(fr.result.split(",")[1]); fr.readAsDataURL(b._file.file); });
          files.push({ path, content: b64, encoding: "base64" }); nb.qr = "/" + path;
        } else nb.qr = b.qr;
        nb.visible = b.visible !== false;
        buttons.push(nb);
      }
      out.push({ id: m.id || "m-" + uid(), label: m.label.trim(), ...(m.visible ? {} : { visible: false }), buttons });
    }
    const keepQr = new Set(out.flatMap((m) => m.buttons.map((b) => b.qr && b.qr.replace(/^\//, ""))).filter(Boolean));
    oldQr.forEach((p) => { if (p.startsWith("assets/donate/") && !keepQr.has(p) && tree.includes(p)) deletes.push(p); }); // dọn ảnh QR không còn dùng
    const b = $("#d_save"); b.disabled = true;
    try { await Admin.commitFiles("Admin: cập nhật trang donate", [{ path: PATH, content: JSON.stringify({ ...data, title: title.trim() || data.title, methods: out }, null, 2) + "\n" }, ...files], deletes);
      window.onbeforeunload = null; Admin.toast("Đã lưu. Web cập nhật sau ~1 phút."); setTimeout(() => location.reload(), 1400); }
    catch (e) { Admin.toast(e.message, true); b.disabled = false; }
  }
  draw();
}});
</script></body></html>
