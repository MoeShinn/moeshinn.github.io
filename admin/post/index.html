<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Bài đăng</title>
<link rel="stylesheet" href="/admin/css/admin.css"></head>
<body><div id="app"></div><div id="toast"></div>
<script src="/post/js/render.js"></script>
<script src="/admin/js/core.js"></script>
<script src="/admin/js/seo.js"></script>
<script src="/admin/js/postgen.js"></script>
<script src="/admin/js/rebuild.js"></script>
<script>
Admin.boot({ id: "post", title: "Bài đăng", async render(main) {
  const { esc, $ } = Admin, VIS = { public: "Công khai", unlisted: "Không liệt kê", private: "Riêng tư" };
  main.innerHTML = `<h2>Bài đăng</h2><p class="hint">Đang tải…</p>`;
  let posts, S, tree;
  try { [posts, S, tree] = await Promise.all([Admin.readJson("post/data/posts.json", []), Admin.readJson("site-settings.json", {}), Admin.api("/tree").then((r) => r.files)]); }
  catch (e) { main.innerHTML = `<h2>Bài đăng</h2><p class="err">${esc(e.message)}</p>`; return; }
  const seo = AdminSeo.merge(S.seo), site = seo.siteUrl.replace(/\/$/, "");
  const RENDER = { parseFrontmatter, renderPostBody };
  const assetUrl = (p) => (!p ? "" : /^(https?:)?\/\/|^\//.test(p) ? p : "/post/" + p);

  /* ---------------- Danh sách ---------------- */
  function showList() {
    const rows = posts.map((p, i) => `<tr style="border-top:1px solid var(--line)"><td style="padding:8px 0">${esc(p.title)}<br><small class="hint">${esc(p.id)} · ${esc(p.date)}${p.updated ? " · sửa " + esc(p.updated) : ""} · ${VIS[p.visibility || "public"]}</small></td>
      <td style="text-align:right;white-space:nowrap">${p.visibility === "private" ? "" : `<a href="/post/${encodeURIComponent(p.id)}/" target="_blank">Mở</a> · `}${p.short ? `<a href="#" data-copy="${site}/s/${esc(p.short)}/">Chép link</a> · ` : ""}<a href="#edit/${encodeURIComponent(p.id)}">Sửa</a> · <a href="#" data-del="${i}" style="color:#ff8b8f">Xóa</a></td></tr>`).join("");
    main.innerHTML = `<h2>Bài đăng</h2><p><a class="btn" href="#new">＋ Bài mới</a></p>
      <div class="card"><div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse">${rows || '<tr><td class="hint">Chưa có bài nào. Bấm “Bài mới” để đăng bài đầu tiên.</td></tr>'}</table></div></div>
`;
    main.querySelectorAll("[data-copy]").forEach((el) => (el.onclick = (e) => { e.preventDefault(); Admin.copy(el.dataset.copy, el, { toast: "Đã chép: " + el.dataset.copy }); }));
    main.querySelectorAll("[data-del]").forEach((el) => (el.onclick = async (e) => {
      e.preventDefault(); const p = posts[+el.dataset.del]; if (!confirm(`Xóa bài “${p.title}”? Trang và link rút gọn của bài sẽ bị xóa.`)) return;
      try { await Rebuild.deletePost(Admin, { posts: posts.filter((x) => x !== p), post: p, seo, message: "Admin: xóa bài " + p.id }); Admin.toast("Đã xóa. Web cập nhật sau ~1 phút."); setTimeout(() => location.reload(), 1200); }
      catch (err) { Admin.toast(err.message, true); }
    }));
  }

  /* ---------------- Trình soạn ---------------- */
  async function showEditor(editId) {
    main.innerHTML = `<h2>${editId ? "Sửa bài" : "Bài mới"}</h2><p class="hint">Đang tải…</p>`;
    let meta = {}, body = "", old = null;
    if (editId) {
      old = posts.find((p) => p.id === editId);
      try { ({ meta, body } = parseFrontmatter(await Admin.readText(`post/data/${editId}.md`))); }
      catch (e) { main.innerHTML = `<h2>Sửa bài</h2><p class="err">${esc(e.message)}</p><p><a href="#">← Quay lại</a></p>`; return; }
    }
    const pending = new Map(); // "post/photo/x.webp" -> { b64, url }
    let cover = meta.photo || "";
    const DK = "shinju_post_draft:" + (editId || "new");
    const commentsOn = editId ? String(meta.comments || "").toLowerCase() !== "off" : S.giscus?.enabled !== false;
    main.innerHTML = `<h2>${editId ? "Sửa bài" : "Bài mới"} <a href="#" style="font-size:14px;margin-left:8px">← Danh sách</a></h2><div id="draftbar"></div>
    <div class="card">
      <label>Tiêu đề<input id="p_title" value="${esc(meta.title || "")}"></label>
      <div class="cols">
        <label>ID / đường dẫn (${esc(site)}/post/…)<input id="p_id" ${editId ? "readonly" : ""} value="${esc(editId || "")}" placeholder="để trống: tự tạo từ tiêu đề + 9 số"></label>
        <label>Hiển thị<select id="p_vis">${Object.entries(VIS).map(([k, l]) => `<option value="${k}" ${(old?.visibility || "public") === k ? "selected" : ""}>${l}</option>`).join("")}</select></label>
        <label>Ngày đăng (dd/mm/yyyy)<input id="p_date" value="${esc(meta.date || PostGen.todayDMY())}"></label>
        <label>Ảnh bìa<input id="p_cover" type="file" accept="image/*"></label>
      </div>
      <div id="coverbox" class="hint"></div>
      <label>Từ khóa (cách nhau bằng dấu phẩy)<input id="p_kw" value="${esc(meta.keywords || "")}"></label>
      <label>Mô tả ngắn (hiện trên Google, nên ≤ 155 ký tự)<textarea id="p_desc" rows="2">${esc(meta.description || "")}</textarea></label>
      <button type="button" class="ghost" id="p_ai">✨ AI gợi ý mô tả và từ khóa</button>
      <div style="margin-top:10px"><label class="row"><input type="checkbox" id="p_comments" ${commentsOn ? "checked" : ""}>Cho phép bình luận (Giscus)</label>
      ${editId ? '<label class="row"><input type="checkbox" id="p_minor">Sửa nhỏ — không ghi “đã chỉnh sửa”</label>' : ""}</div>
    </div>
    <div class="card"><div class="tb" id="tb"></div><div class="sw" id="sw"></div>
      <div class="editor"><textarea id="p_body" spellcheck="false" placeholder="Viết nội dung ở đây…">${esc(body)}</textarea><iframe id="pv" title="Xem trước"></iframe></div>
      <input id="p_img" type="file" accept="image/*" hidden></div>
    <button id="p_save">${editId ? "Lưu thay đổi" : "Đăng bài"}</button> <span class="hint" id="p_st"></span>`;

    const ta = $("#p_body"), fire = () => ta.dispatchEvent(new Event("input"));
    const wrap = (pre, post, ph = "văn bản") => { const s = ta.selectionStart, e = ta.selectionEnd; ta.setRangeText(pre + (ta.value.slice(s, e) || ph) + post, s, e, "end"); ta.focus(); fire(); };
    const block = (html) => { const s = ta.selectionStart, b = ta.value.slice(0, s), lead = !b ? "" : b.endsWith("\n\n") ? "" : b.endsWith("\n") ? "\n" : "\n\n"; ta.setRangeText(lead + html + "\n\n", s, ta.selectionEnd, "end"); ta.focus(); fire(); };
    const sel = (ph) => ta.value.slice(ta.selectionStart, ta.selectionEnd) || ph;
    const lines = (ph) => sel(ph).split("\n").map((x) => x.trim()).filter(Boolean);
    const q = (s) => String(s).replace(/"/g, "%22");
    const ask = (m, d = "") => prompt(m, d);

    async function prep(file) {
      if (/gif|svg/.test(file.type)) return { blob: file, ext: file.type.includes("gif") ? "gif" : "svg" };
      const bm = await createImageBitmap(file), k = Math.min(1, 1600 / bm.width), c = document.createElement("canvas");
      c.width = Math.round(bm.width * k); c.height = Math.round(bm.height * k); c.getContext("2d").drawImage(bm, 0, 0, c.width, c.height);
      const w = await new Promise((r) => c.toBlob(r, "image/webp", 0.85));
      return w && w.type === "image/webp" ? { blob: w, ext: "webp" } : { blob: await new Promise((r) => c.toBlob(r, "image/png")), ext: "png" };
    }
    async function addImage(file) { // trả về đường dẫn trong repo, ảnh nằm chờ trong bộ nhớ tới khi đăng
      const { blob, ext } = await prep(file), name = `${PostGen.slugify(file.name.replace(/\.[^.]+$/, ""))}-${Date.now().toString(36)}.${ext}`;
      const b64 = await new Promise((r) => { const f = new FileReader(); f.onload = () => r(f.result.split(",")[1]); f.readAsDataURL(blob); });
      pending.set("post/photo/" + name, { b64, url: URL.createObjectURL(blob) }); return "post/photo/" + name;
    }

    const TB = [
      ["B", "In đậm (§l)", () => wrap("§l", "§r")], ["I", "In nghiêng (§o)", () => wrap("§o", "§r")], ["U", "Gạch chân (§n)", () => wrap("§n", "§r")], ["S", "Gạch ngang (§m)", () => wrap("§m", "§r")],
      ["🎨 Màu", "Chữ màu", () => $("#sw").classList.toggle("on")],
      ["🔗 Link", "Link dạng chữ", () => { const u = ask("Dán link (https://…)"); if (u) wrap("[", `](${u.trim()})`); }],
      ["🔘 Nút", "Link dạng nút (mở ngay)", () => { const l = ask("Chữ trên nút", "Mở link"), u = l && ask("Dán link (https://…)"); if (u) block(`<a class="btn" href="${q(u.trim())}" target="_blank" rel="noopener noreferrer">${esc(l)}</a>`); }],
      ["⏱ Nút đếm", "Nút đếm ngược rồi mới mở", () => { const l = ask("Chữ trên nút", "Mở link"), u = l && ask("Dán link (https://…)"), n = u && Math.max(1, parseInt(ask("Đếm ngược bao nhiêu giây?", "5")) || 5); if (u) block(`<a class="button-5s" data-seconds="${n}" href="${q(u.trim())}" target="_blank" rel="noopener noreferrer">${esc(l)}</a>`); }],
      ["🖼 Ảnh", "Chèn ảnh", () => $("#p_img").click()],
      ["H2", "Tiêu đề lớn", () => block(`<h2>${sel("Tiêu đề")}</h2>`)], ["H3", "Tiêu đề nhỏ", () => block(`<h3>${sel("Tiêu đề")}</h3>`)],
      ["• Liệt kê", "Danh sách", () => block(`<ul>${lines("Mục 1\nMục 2").map((x) => `<li>${x}</li>`).join("")}</ul>`)],
      ["❝ Trích", "Trích dẫn", () => block(`<blockquote>${lines("Trích dẫn").join("<br>")}</blockquote>`)],
      ["― Kẻ", "Đường kẻ ngang", () => block("<hr>")],
      ["⌫ Xóa định dạng", "Chèn §r", () => wrap("", "§r", "")],
    ];
    TB.forEach(([l, t, f]) => { const b = document.createElement("button"); b.type = "button"; b.textContent = l; b.title = t; b.onclick = f; $("#tb").appendChild(b); });
    Object.entries(MC_COLORS).forEach(([k, c]) => { const i = document.createElement("i"); i.style.background = c; i.title = "§" + k; i.onclick = () => wrap("§" + k, "§r"); $("#sw").appendChild(i); });
    ta.onkeydown = (e) => { if (e.ctrlKey || e.metaKey) { const m = { b: 0, i: 1, u: 2 }[e.key.toLowerCase()]; if (m !== undefined) { e.preventDefault(); TB[m][2](); } } };
    $("#p_img").onchange = async (e) => { const f = e.target.files[0]; e.target.value = ""; if (!f) return;
      try { const p = await addImage(f), alt = (ask("Mô tả ảnh (cho SEO, có thể bỏ trống)") || "").replace(/[\[\]()]/g, ""); block(`![${alt}](/${p})`); } catch (err) { Admin.toast(err.message, true); } };
    const drawCover = () => { const u = cover && (pending.get("post/" + cover)?.url || assetUrl(cover)); $("#coverbox").innerHTML = cover ? `<img src="${esc(u)}" style="max-height:90px;border-radius:8px;vertical-align:middle"> <a href="#" id="cov_rm">Bỏ ảnh bìa</a>` : "Chưa có ảnh bìa."; const rm = $("#cov_rm"); if (rm) rm.onclick = (e) => { e.preventDefault(); cover = ""; drawCover(); preview(); }; };
    $("#p_cover").onchange = async (e) => { const f = e.target.files[0]; if (!f) return; try { cover = (await addImage(f)).replace(/^post\//, ""); drawCover(); preview(); } catch (err) { Admin.toast(err.message, true); } };

    function preview() {
      let html = renderPostBody(ta.value), cv = cover ? assetUrl(cover) : "";
      for (const [p, { url }] of pending) { html = html.split("/" + p).join(url); cv = cv.split("/" + p).join(url); }
      $("#pv").srcdoc = `<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="/post/css/style.css"><body style="padding:12px"><div class="post-view"><article class="post-article">${cv ? `<img class="post-cover" src="${esc(cv)}">` : ""}<h1 class="post-title">${esc($("#p_title").value)}</h1><div class="post-body">${html}</div></article></div></body>`;
    }
    const F = ["p_title", "p_id", "p_vis", "p_date", "p_kw", "p_desc", "p_body"];
    const snap = () => ({ ...Object.fromEntries(F.map((i) => [i, $("#" + i).value])), cover, comments: $("#p_comments").checked });
    let t1, t2; const clean = JSON.stringify(snap());
    const onEdit = () => { clearTimeout(t1); t1 = setTimeout(preview, 250); clearTimeout(t2); t2 = setTimeout(() => { const s = JSON.stringify(snap()); try { s === clean ? localStorage.removeItem(DK) : localStorage.setItem(DK, s); } catch (e) { /* bỏ qua */ } }, 800); };
    main.querySelectorAll("input,textarea,select").forEach((el) => el.addEventListener("input", onEdit));
    try { const d = JSON.parse(localStorage.getItem(DK) || "null"); if (d) { $("#draftbar").innerHTML = `<div class="bar">Có bản nháp chưa đăng trên máy này. <a href="#" id="d_ok">Khôi phục</a> · <a href="#" id="d_no">Bỏ nháp</a></div>`;
      $("#d_ok").onclick = (e) => { e.preventDefault(); F.forEach((i) => { if (!($("#" + i).readOnly)) $("#" + i).value = d[i] ?? ""; }); cover = d.cover || ""; $("#p_comments").checked = d.comments !== false; drawCover(); preview(); $("#draftbar").innerHTML = ""; };
      $("#d_no").onclick = (e) => { e.preventDefault(); localStorage.removeItem(DK); $("#draftbar").innerHTML = ""; }; } } catch (e) { /* bỏ qua */ }
    $("#p_ai").onclick = async () => { const b = $("#p_ai"); b.disabled = true;
      try { const r = await Admin.api("/ai/seo", { title: $("#p_title").value, body: ta.value }); if (r.description) $("#p_desc").value = r.description; if (r.keywords) $("#p_kw").value = [].concat(r.keywords).join(", "); Admin.toast("AI đã điền gợi ý, xem lại rồi đăng."); onEdit(); }
      catch (e) { Admin.toast(e.message, true); } b.disabled = false; };

    $("#p_save").onclick = async () => {
      const v = (i) => $("#" + i).value.trim(), title = v("p_title"), text = ta.value.trim();
      if (!title) return Admin.toast("Cần nhập tiêu đề", true);
      if (!text) return Admin.toast("Nội dung đang trống", true);
      if (!/^\d{2}\/\d{2}\/\d{4}$/.test(v("p_date"))) return Admin.toast("Ngày phải dạng dd/mm/yyyy", true);
      const used = new Set([...posts.map((p) => p.id), ...tree.map((f) => (f.path.match(/^post\/([^/]+)\/index\.html$/) || [])[1]).filter(Boolean)]);
      let id = editId;
      if (!id) { const c = v("p_id") && PostGen.slugify(v("p_id")); if (c) { if (used.has(c)) return Admin.toast("ID này đã có bài dùng", true); id = c; } else id = PostGen.newPostId(title, used); }
      const md = PostGen.buildMarkdown({ title, photo: cover, date: v("p_date"), keywords: v("p_kw"), description: v("p_desc"), comments: $("#p_comments").checked }, text);
      const entry = { ...(old || {}), id, title: title.replace(/"/g, "”"), date: v("p_date"), visibility: $("#p_vis").value };
      if (cover) entry.photo = cover; else delete entry.photo;
      if (old && !$("#p_minor")?.checked) entry.updated = PostGen.todayDMY();
      const next = old ? posts.map((p) => (p.id === id ? entry : p)) : [entry, ...posts];
      const files = [];
      for (const [p, { b64 }] of pending) if (md.includes(p.replace(/^post\//, ""))) files.push({ path: p, content: b64, encoding: "base64" }); // chỉ đưa lên ảnh còn được dùng
      if (files.reduce((n, f) => n + f.content.length, md.length) > 3200000) return Admin.toast("Ảnh quá nặng (tối đa ~3 MB mỗi lần đăng). Dùng ảnh nhỏ hơn hoặc đăng từng phần.", true);
      const b = $("#p_save"); b.disabled = true;
      try {
        $("#p_st").textContent = "Đang đăng…";
        await Rebuild.savePost(Admin, { posts: next, id, md, extraFiles: files, seo, render: RENDER, message: `Admin: ${editId ? "sửa" : "đăng"} bài ${id}` });
        try { localStorage.removeItem(DK); } catch (e) { /* bỏ qua */ }
        Admin.toast(`Đã ${editId ? "lưu" : "đăng"}: ${site}/post/${id}/ (hoạt động sau ~1 phút)`); setTimeout(() => { location.hash = ""; location.reload(); }, 1800);
      } catch (e) { $("#p_st").textContent = ""; Admin.toast(e.message, true); b.disabled = false; }
    };
    drawCover(); preview();
  }

  const show = () => { const h = location.hash; if (h === "#new") showEditor(null); else if (h.startsWith("#edit/")) showEditor(decodeURIComponent(h.slice(6))); else showList(); };
  addEventListener("hashchange", show); show();
}});
</script></body></html>
